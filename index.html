<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2a6ae0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lasses Welt">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
</head>
<body>
<title>Lasses Welt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: vier Bildschirme nacheinander – Spieler, Weltkarte (Inseln an einer Linie, verdeckt von Wolken), Levelauswahl (3×3 Zahlen), Spiel.
   Bewusst ein einziges helles Thema (Kinderspiel). Jede Welt setzt ihre eigenen Farb-Tokens auf <body>. */
:root {
  --bg: #dcecff;         /* Seitenhintergrund */
  --bg-2: #f3f8ff;
  --card: #ffffff;
  --ink: #4a3728;        /* Schrift, Konturen */
  --muted: #6a7fa8;
  --accent: #2a6ae0;
  --accent-dark: #1a4bae;
  --soft: #e3edff;
  --edge: #c9daf5;       /* Kartenkante */
  --floor-a: #8fdc7c;
  --floor-b: #80d16d;
  --black: #16181f;
  --white: #ffffff;
  --sun: #ffcc33;
  --red: #ef4b4b;
  --display: "Fredoka", "Baloo 2", "Trebuchet MS", sans-serif;
  --body: "Nunito", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  background: radial-gradient(90% 60% at 50% 0%, var(--bg-2) 0%, var(--bg) 70%) var(--bg);
  background-attachment: fixed;
  color: var(--ink);
  font-family: var(--body);
  padding-inline: 16px;
  padding-block: 16px 24px;
  box-sizing: border-box;
  overflow-x: hidden;
}
.wrap { max-width: 720px; margin-inline: auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; justify-items: center; }
.screen { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; justify-items: center; }

button { font: inherit; cursor: pointer; border: 0; color: var(--ink); background: var(--card); border-radius: 999px;
  font-family: var(--display); font-weight: 600; box-shadow: 0 4px 0 var(--edge); transition: transform 80ms, box-shadow 80ms; }
button:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--edge); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
button:disabled { cursor: default; }
.primary { background: var(--accent); color: var(--white); box-shadow: 0 4px 0 var(--accent-dark); }
.primary:active:not(:disabled) { box-shadow: 0 1px 0 var(--accent-dark); }

/* Kopfzeile der Unterseiten */
.topbar { width: 100%; display: flex; align-items: center; gap: 12px; }
.topbar h2 { margin: 0; flex: 1 1 auto; min-width: 0; font-family: var(--display); font-weight: 700; font-size: 24px; line-height: 1.1; text-wrap: balance; }
.topbar h2 small { display: block; font-family: var(--body); font-size: 13px; font-weight: 700; color: var(--muted); }
/* Text direkt auf dem Seitenhintergrund: auf dunklen Welten hell */
.topbar h2 { color: var(--on-bg-strong, var(--ink)); }
.topbar h2 small, .levelgrid .row-name { color: var(--on-bg, var(--muted)); }
.back { padding: 8px 14px; font-size: 15px; display: flex; align-items: center; gap: 6px; flex: none; }
.back svg { width: 16px; height: 16px; }

/* ---------- Startseite: Spieler ---------- */
.title { text-align: center; display: grid; gap: 6px; justify-items: center; padding-block: 8px 4px; }
.title h1 { margin: 0; font-family: var(--display); font-weight: 700; font-size: clamp(38px, 11vw, 60px); line-height: 1; color: var(--accent); letter-spacing: .01em; }
.title p { margin: 0; color: var(--muted); font-weight: 700; }
.title .hero { width: 120px; height: 120px; }
.title .hero .body { transform-origin: 50% 92%; transform-box: view-box; animation: idle 1.6s ease-in-out infinite; }
.title .hero.family { width: min(340px, 100%); height: auto; aspect-ratio: 700 / 814; position: relative; }
.title .hero.family::after { content: ""; position: absolute; left: 6%; right: 6%; bottom: -1%; height: 5%; border-radius: 50%; background: #2a3f8418; z-index: -1; }
.title .hero.family > img { width: 100%; height: 100%; display: block; }
.fam-bob { transform-box: fill-box; transform-origin: 50% 100%; animation: fambob 3.2s ease-in-out infinite; }
@keyframes fambob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1.5px); } }
@media (prefers-reduced-motion: reduce) { .fam-bob { animation: none !important; } }
.title .hero .eyes { transform-origin: 50% 36%; transform-box: view-box; animation: blink 3.8s infinite; }
.players { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.player { display: flex; align-items: center; gap: 12px; padding: 10px 16px 10px 10px; border-radius: 22px; text-align: left; flex: 1 1 auto; min-width: 0; }
.player .face { width: 54px; height: 54px; flex: none; border-radius: 50%; background: var(--soft); overflow: hidden; }
.player .face svg { width: 100%; height: 100%; transform: scale(1.7) translateY(14%); }
.player .pname { flex: 1 1 auto; min-width: 0; font-size: 22px; font-weight: 700; overflow-wrap: anywhere; }
.player .pprog { font-family: var(--body); font-size: 13px; font-weight: 800; color: var(--muted); white-space: nowrap; }
.player-row { display: flex; gap: 8px; align-items: stretch; }
.player-row .del { flex: none; width: 46px; border-radius: 16px; color: var(--muted); display: grid; place-items: center; }
.player-row .del svg { width: 18px; height: 18px; }
.confirm { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: flex-end; padding: 4px 4px 0; font-weight: 700; color: var(--muted); }
.confirm button { padding: 6px 14px; font-size: 15px; }
.confirm .danger { background: var(--red); color: var(--white); box-shadow: 0 4px 0 #b83434; }
.add { width: 100%; display: flex; gap: 8px; }
.add input { flex: 1 1 auto; min-width: 0; font: inherit; font-weight: 700; font-size: 17px; border: 0; border-radius: 999px; padding: 12px 18px; background: var(--card); color: var(--ink); box-shadow: inset 0 2px 0 var(--edge); }
.add button { padding: 10px 18px; font-size: 17px; flex: none; }
.credit { font-size: 12px; color: var(--muted); text-align: center; line-height: 1.5; margin: 6px 0 0; max-width: 46ch; }

/* ---------- Weltkarte ---------- */
.map { position: relative; width: 100%; max-width: 460px; }
.map svg.route { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.world { position: absolute; transform: translate(-50%, -50%); display: grid; justify-items: center; gap: 4px; width: 132px; }
.world button { width: 96px; height: 96px; border-radius: 50%; display: grid; place-items: center; position: relative; box-shadow: 0 6px 0 var(--edge), 0 10px 24px #00000014; }
.world button svg.icon { width: 58px; height: 58px; }
.world .wname { font-family: var(--display); font-weight: 700; font-size: 16px; text-align: center; line-height: 1.1; }
.world .wprog { font-size: 12px; font-weight: 800; color: var(--muted); }
.world .wprog.full { color: var(--accent); }
.cloud { position: absolute; left: 50%; top: 44px; width: 170px; height: 120px; transform: translate(-50%, -50%); pointer-events: none; }
.world.locked button { box-shadow: none; background: transparent; }
.world.locked .icon, .world.locked .wprog { visibility: hidden; }
.world.reveal .cloud { animation: lift 1.4s ease-in forwards; }
@keyframes lift { 0% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 30% { transform: translate(-50%, -55%) scale(1.06); } 100% { opacity: 0; transform: translate(-50%, -120%) scale(1.4); } }
.world.current button::after { content: ""; position: absolute; inset: -8px; border-radius: 50%; border: 3px dashed var(--accent); animation: spin 8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- Levelauswahl ---------- */
.levelgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 110px)); gap: 14px; justify-content: center; width: 100%; }
.lvl { aspect-ratio: 1; max-width: 100%; border-radius: 24px; font-size: 36px; font-weight: 700; position: relative; display: grid; place-items: center; }
.lvl.done { background: var(--soft); }
.lvl .star { position: absolute; right: -6px; top: -6px; width: 30px; height: 30px; }
.lvl.locked { background: color-mix(in srgb, var(--card) 45%, transparent); color: color-mix(in srgb, var(--muted) 60%, transparent); box-shadow: none; }
.lvl.locked svg { width: 28px; height: 28px; }
.lvl.next { background: var(--accent); color: var(--white); box-shadow: 0 4px 0 var(--accent-dark); }
.lvl-hint { margin: 0; text-align: center; color: var(--muted); font-weight: 700; font-size: 14px; }

/* ---------- Spiel ---------- */
.head { width: 100%; box-sizing: border-box; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  background: var(--card); border-radius: 22px; padding: 12px 16px; box-shadow: 0 6px 0 var(--edge), 0 14px 30px #0000000f; }
.emblem { width: 44px; height: 44px; flex: none; display: block; }
.who { flex: 1 1 auto; min-width: 0; }
.who h1 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 24px; line-height: 1; overflow-wrap: anywhere; }
.who p { margin: 4px 0 0; font-size: 13px; font-weight: 700; color: var(--muted); }
.slots { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.slot { width: 34px; height: 34px; border-radius: 50%; background: var(--soft); box-shadow: inset 0 2px 0 var(--edge); display: grid; place-items: center; }
.slots.many .slot { width: 22px; height: 22px; }
.slot svg { width: 82%; height: 82%; transform: scale(0); transition: transform 300ms cubic-bezier(.3,1.8,.5,1); }
.slot.on svg { transform: scale(1); }

.bar { width: 100%; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.stats { display: flex; gap: 8px; }
.chip { background: var(--card); border-radius: 999px; padding: 6px 12px; font-weight: 800; font-size: 13px; color: var(--muted); box-shadow: 0 3px 0 var(--edge); }
.chip b { color: var(--ink); font-variant-numeric: tabular-nums; font-size: 15px; margin-left: 4px; }
.actions { display: flex; gap: 8px; }
.actions button { padding: 8px 14px; font-size: 15px; display: flex; align-items: center; gap: 6px; }
.actions svg { width: 16px; height: 16px; }

.stage { position: relative; max-width: 100%; }
/* Gäste, die neben dem Spielfeld stehen (z. B. beim Grillfest) */
.arena { width: 100%; display: flex; align-items: flex-end; justify-content: center; gap: 4px; }
.arena .stage { flex: 0 1 auto; min-width: 0; }
.side { flex: none; width: 0; align-self: flex-end; }
.arena.has-side .side { display: flex; align-items: flex-end; }
.arena.has-side #side-l { width: calc(var(--side-w) * (1 + .45 * (var(--side-l) - 1))); }
.arena.has-side #side-r { width: calc(var(--side-w) * (1 + .45 * (var(--side-r) - 1))); }
.side svg { width: var(--side-w); flex: none; height: auto; display: block; overflow: visible; }
.side svg + svg { margin-left: calc(var(--side-w) * -.55); }
.side .bobside { animation: idle 2.2s ease-in-out infinite; transform-origin: 50% 98%; transform-box: view-box; }
@media (prefers-reduced-motion: reduce) { .side .bobside { animation: none !important; } }
#board { position: relative; width: calc(var(--w) * var(--t)); height: calc(var(--h) * var(--t)); touch-action: none; user-select: none; -webkit-user-select: none; }
.tile { position: absolute; width: var(--t); height: var(--t); left: calc(var(--x) * var(--t)); top: calc(var(--y) * var(--t)); }
.tile svg, .sprite svg { width: 100%; height: 100%; display: block; overflow: visible; }
.floor { background: var(--floor-a); }
.floor.b { background: var(--floor-b); }
.theme-reiten .floor { background-image: radial-gradient(circle at 25% 30%, #c9a46a55 0 1.5px, transparent 2px), radial-gradient(circle at 70% 65%, #c9a46a55 0 1.5px, transparent 2px), radial-gradient(circle at 55% 20%, #ffffff66 0 1px, transparent 1.5px); }
.sprite { position: absolute; left: 0; top: 0; width: var(--t); height: var(--t);
  transform: translate(calc(var(--x) * var(--t)), calc(var(--y) * var(--t)));
  transition: transform 170ms cubic-bezier(.3,.7,.4,1); will-change: transform; }

.box .spin { width: 100%; height: 100%; transform: rotate(var(--rot)); transition: transform 170ms cubic-bezier(.3,.7,.4,1); }
.box .squash { width: 100%; height: 100%; transform-origin: 50% 80%; }
.box.in .squash { animation: boing 420ms cubic-bezier(.3,1.6,.5,1); }
.box.shove .squash { animation: shove 200ms ease-out; }
@keyframes boing { 0% { transform: scale(1); } 30% { transform: scale(1.18, .82); } 60% { transform: scale(.92, 1.08); } 100% { transform: scale(1); } }
.box.squish .squash { animation: squish 380ms cubic-bezier(.3,1.5,.5,1); }
.theme-reiten .box:not(.squish):not(.in) .squash { animation: breathe 2.4s ease-in-out infinite; }
@keyframes squish { 0% { transform: scale(1); } 25% { transform: scale(1.28, .74); } 55% { transform: scale(.88, 1.14); } 80% { transform: scale(1.05, .96); } 100% { transform: scale(1); } }
@keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04, .96); } }
@keyframes shove { 0% { transform: rotate(0); } 35% { transform: rotate(-6deg) scale(1.05, .95); } 70% { transform: rotate(4deg); } 100% { transform: rotate(0); } }

.target .glow { transition: fill 250ms, opacity 250ms; }
.target .fx { opacity: 0; transform-origin: 50% 50%; transform-box: fill-box; }
.target.hit .fx { animation: twinkle 800ms ease-out; }
@keyframes twinkle { 0% { opacity: 0; transform: translateY(6px) scale(.4); } 40% { opacity: 1; transform: translateY(-2px) scale(1.1); } 100% { opacity: 0; transform: translateY(-10px) scale(1.2); } }
.theme-fussball .target.hit .glow { fill: #fff3b8; }
.theme-reiten .target .glow, .theme-neutral .target .glow { opacity: 0; }
.theme-reiten .target.hit .glow, .theme-neutral .target.hit .glow { opacity: 1; }

.horse .ears { transform-origin: 50% 30%; transform-box: view-box; animation: ears 5s ease-in-out infinite; }
.horse .h-eyes { transform-origin: 50% 36%; transform-box: view-box; animation: blink 4.6s infinite; }
@keyframes ears { 0%, 80%, 100% { transform: rotate(0); } 84% { transform: rotate(-6deg); } 88% { transform: rotate(5deg); } 92% { transform: rotate(0); } }

#lasse { z-index: 3; }
#lasse .face-dir { width: 100%; height: 100%; transition: transform 120ms; }
#lasse svg { transform: scale(1.18); transform-origin: 50% 90%; }
#lasse .body { transform-origin: 50% 92%; transform-box: view-box; animation: idle 1.6s ease-in-out infinite; }
#lasse.hop .body { animation: hop 200ms ease-out, idle 1.6s ease-in-out 200ms infinite; }
#lasse.kick .body { animation: kick 220ms ease-out, idle 1.6s ease-in-out 220ms infinite; }
#lasse.cheer .body { animation: cheer 600ms ease-in-out infinite; }
#lasse .eyes { transform-origin: 50% 36%; transform-box: view-box; animation: blink 3.8s infinite; }
#lasse .shadow { transform-origin: 50% 93%; transform-box: view-box; animation: shadow 1.6s ease-in-out infinite; }
@keyframes idle { 0%,100% { transform: translateY(0) scale(1, 1); } 50% { transform: translateY(-2px) scale(1.02, .98); } }
@keyframes hop { 0% { transform: scale(1.08, .9); } 45% { transform: translateY(-12px) scale(.95, 1.06); } 100% { transform: translateY(0) scale(1); } }
@keyframes kick { 0% { transform: rotate(0); } 40% { transform: rotate(10deg) translateX(5px); } 100% { transform: rotate(0); } }
@keyframes cheer { 0%,100% { transform: translateY(0) scale(1.05, .95); } 50% { transform: translateY(-20px) scale(.96, 1.05); } }
@keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
@keyframes shadow { 0%,100% { transform: scale(1); } 50% { transform: scale(.9); } }

.win { position: absolute; inset: -8px; display: grid; place-items: center; background: color-mix(in srgb, var(--bg) 80%, transparent); border-radius: 24px; z-index: 5; }
.win-card { background: var(--card); border-radius: 26px; padding: 22px 26px; display: grid; gap: 8px; justify-items: center; text-align: center;
  box-shadow: 0 8px 0 var(--edge), 0 20px 40px #00000022; animation: pop 500ms cubic-bezier(.3,1.7,.5,1); max-width: 86%; }
.win-card .emblem { width: 64px; height: 64px; }
.win h3 { margin: 0; font-family: var(--display); font-weight: 700; font-size: clamp(40px, 12vw, 68px); line-height: .95; color: var(--accent); letter-spacing: .02em; text-wrap: balance; }
.win p { margin: 0; font-weight: 700; color: var(--muted); }
.win-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 6px; }
.win-actions button { padding: 10px 20px; font-size: 17px; }
@keyframes pop { from { transform: scale(.4); opacity: 0; } }
#confetti { position: absolute; inset: 0; pointer-events: none; z-index: 6; }
.bit { position: absolute; top: 30%; width: 9px; height: 14px; border-radius: 3px; animation: fall 1.4s cubic-bezier(.2,.6,.4,1) forwards; }
@keyframes fall { from { transform: translate(0, 0) rotate(0); opacity: 1; } to { transform: translate(var(--dx), var(--dy)) rotate(var(--r)); opacity: 0; } }

.pad-zone { padding-top: 10px; }
.pad { display: grid; grid-template-columns: repeat(3, 58px); grid-template-rows: repeat(3, 58px); gap: 6px; }
.pad button { border-radius: 18px; color: var(--accent); display: grid; place-items: center; }
.pad button svg { width: 24px; height: 24px; }
.pad button[data-d="u"] { grid-area: 1 / 2; } .pad button[data-d="l"] { grid-area: 2 / 1; }
.pad button[data-d="r"] { grid-area: 2 / 3; } .pad button[data-d="d"] { grid-area: 3 / 2; }
.hint { font-size: 13px; color: var(--muted); text-align: center; max-width: 44ch; line-height: 1.5; margin: 0; }

@media (prefers-reduced-motion: reduce) {
  .sprite, .box .spin { transition: none; }
  #lasse .body, #lasse .eyes, #lasse .shadow, .box .squash, .box.squish .squash, .target.hit .fx, .win-card, .bit, .horse .ears, .horse .h-eyes,
  .title .hero .body, .title .hero .eyes, .world.current button::after { animation: none !important; }
  .world.reveal .cloud { animation-duration: 1ms; }
}
/* ---------- Schauplätze: Deko und kleine Animationen ---------- */
.hint, .lvl-hint { color: var(--on-bg, var(--muted)); }
#deco { position: absolute; inset: 0; pointer-events: none; z-index: 4; }
.stage.has-bunting { padding-top: 26px; }
.bunting { position: absolute; left: -4px; right: -4px; top: -2px; height: 30px; }
.bunting svg { width: 100%; height: 100%; display: block; }
.pennant { transform-box: fill-box; transform-origin: 50% 0; animation: flutter 2.4s ease-in-out infinite; }
@keyframes flutter { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }
.floodlight { position: absolute; top: 20px; width: 60%; height: 70%; pointer-events: none; mix-blend-mode: screen; opacity: .35; }
.floodlight.l { left: -10%; background: radial-gradient(60% 60% at 20% 0%, #fffbe0 0%, transparent 70%); }
.floodlight.r { right: -10%; background: radial-gradient(60% 60% at 80% 0%, #fffbe0 0%, transparent 70%); }
.fly { position: absolute; left: 0; top: 0; width: 22px; height: 17px; animation: flypath var(--dur) ease-in-out var(--delay) infinite alternate; }
.fly svg { width: 100%; height: 100%; display: block; }
.fly .wings { transform-origin: 50% 50%; transform-box: view-box; animation: flap 260ms ease-in-out infinite alternate; }
@keyframes flypath { 0% { left: var(--x0); top: var(--y0); } 50% { left: calc((var(--x0) + var(--x1)) / 2); top: calc(var(--y0) - 12%); } 100% { left: var(--x1); top: var(--y1); } }
@keyframes flap { from { transform: scaleX(1); } to { transform: scaleX(.35); } }
.bird { position: absolute; top: 4%; left: -10%; width: 30px; height: 15px; animation: birdfly 16s linear infinite; }
.bird svg { width: 100%; height: 100%; display: block; overflow: visible; }
.bird .wing { transform-origin: 50% 50%; transform-box: fill-box; animation: birdflap 400ms ease-in-out infinite alternate; }
@keyframes birdfly { 0% { left: -12%; top: 8%; } 50% { top: 2%; } 100% { left: 108%; top: 10%; } }
@keyframes birdflap { from { transform: scaleY(1); } to { transform: scaleY(-.6); } }
.fan { transform-origin: 50% 90%; transform-box: view-box; animation: cheerfan 1.8s ease-in-out infinite; }
@keyframes cheerfan { 0%, 60%, 100% { transform: translateY(0); } 70% { transform: translateY(-6px); } 80% { transform: translateY(0); } 90% { transform: translateY(-4px); } }
.clap { transform-origin: 50% 90%; transform-box: view-box; animation: cheerfan 2.2s ease-in-out infinite; }
.pony .graze { transform-origin: 34px 50px; animation: graze 4s ease-in-out infinite; }
@keyframes graze { 0%, 35%, 100% { transform: rotate(0); } 50%, 80% { transform: rotate(-18deg); } }
.horse .peek { animation: peek 6s ease-in-out infinite; }
@keyframes peek { 0%, 70%, 100% { transform: translateY(0); } 78%, 90% { transform: translateY(-5px); } }
.trainer .notes { opacity: 0; animation: notes 3s ease-out infinite; }
@keyframes notes { 0%, 60% { opacity: 0; transform: translate(0, 4px); } 70% { opacity: 1; } 100% { opacity: 0; transform: translate(4px, -8px); } }
.tile.deco { pointer-events: none; }
.tile.deco svg { overflow: visible; }

/* Preis im Finale */
.win-card.prize .emblem { width: 120px; height: 120px; animation: prizein 900ms cubic-bezier(.3,1.6,.5,1); filter: drop-shadow(0 6px 10px #b97a0655); }
.win-card.prize { background: radial-gradient(70% 50% at 50% 25%, #fff6cf 0%, var(--card) 70%); }
@keyframes prizein { 0% { transform: scale(0) rotate(-30deg); } 70% { transform: scale(1.15) rotate(6deg); } 100% { transform: scale(1) rotate(0); } }
.lvl .prize-ico { position: absolute; right: -8px; top: -10px; width: 34px; height: 40px; }

// Grundplatte mit Noppen (n × n)
const plate = (fill, stud, n, x, y) => {
  const step = 100 / n, r = step * .3;
  let s = `<svg viewBox="0 0 100 100"><rect width="100" height="100" fill="${(x + y) % 2 ? `color-mix(in srgb, ${fill} 94%, #000)` : fill}"/>`;
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    const cx = step * (i + .5), cy = step * (j + .5);
    s += `<circle cx="${cx}" cy="${cy + r * .18}" r="${r}" fill="#00000022"/><circle cx="${cx}" cy="${cy}" r="${r}" fill="${stud}"/><circle cx="${cx - r * .3}" cy="${cy - r * .3}" r="${r * .35}" fill="#ffffff" opacity=".35"/>`;
  }
  return s;
};

// Plan wird beim Aufbau eines Levels einmal berechnet: Personen weit verteilt, übrige Wände
// gleichmäßig aus allen Motiven, nie zwei gleiche nebeneinander oder übereinander.
function feierPlan(decor, people) {
  const vis = [];
  for (const k of walls) { const [x, y] = k.split(",").map(Number); if (touchesInside(x, y)) vis.push([x, y]); }
  const plan = new Map(), chosen = [];
  const order = vis.slice().sort((a, b) => hash(a[0], a[1], 7) - hash(b[0], b[1], 7));
  for (const [pi, p] of people.entries()) {
    let best = null, bestD = -1;
    for (const [x, y] of order) {
      if (plan.has(key(x, y))) continue;
      const d = chosen.length ? Math.min(...chosen.map(([a, b]) => Math.abs(a - x) + Math.abs(b - y))) : 0;
      if (d > bestD) { bestD = d; best = [x, y]; }
      if (!chosen.length) break;
    }
    if (!best) break;
    plan.set(key(best[0], best[1]), p.replace("<svg", `<svg data-person="${pi}"`)); chosen.push(best);
  }
  const used = decor.map(() => 0);
  vis.sort((a, b) => a[1] - b[1] || a[0] - b[0]);
  for (const [x, y] of vis) {
    const k = key(x, y); if (plan.has(k)) continue;
    const near = [plan.get(key(x - 1, y)), plan.get(key(x, y - 1)), plan.get(key(x + 1, y)), plan.get(key(x, y + 1))];
    const idx = decor.map((_, i) => i).sort((a, b) => used[a] - used[b] || hash(x, y, a + 50) - hash(x, y, b + 50));
    let html = null;
    for (const i of idx) { const h = decor[i](x, y); if (!near.includes(h)) { html = h; used[i]++; break; } }
    plan.set(k, html || decor[idx[0]](x, y));
  }
  return plan;
}
const feierWalls = (decor, people) => { let ref = null, plan = null;
  return (x, y) => { if (ref !== walls) { ref = walls; plan = feierPlan(decor, people()); } return plan.get(key(x, y)) || decor[pick(x, y, 31, decor.length)](x, y); }; };

// Stimmung je Welt und Schauplatz
function moodOf(theme, sceneName = "") {
  if (/Flutlicht|Weltraum|Konzert/.test(sceneName)) return "nacht";
  if (/Feuer/.test(sceneName)) return "feuer";
  if (theme === "steine") return "hoehle";
  if (/Halle|City|Küche|Restaurant|Stall|Psycho|Kampf|Schlagzeug|Flugzeug|Klassenzimmer|Bistro|Puppenecke|Kinderzimmer|Duplo|Kinderschlagzeug|Konservatorium/.test(sceneName)) return "drinnen";
  if (theme === "schule") return /Pause|Sport/.test(sceneName) ? "draussen" : "drinnen";
  return "draussen";
}
function wallDetail(mood, x, y) {
  const list = MOODS[mood]; if (!list) return "";
  if (pick(x, y, 41, 100) > 42) return "";
  const a = hash(x, y, 43) % 97;
  return DETAIL[list[pick(x, y, 42, list.length)]](a);
}
function floorDetail(mood, x, y) {
  const f = FLOOR_BITS[mood]; if (!f) return "";
  if (pick(x, y, 51, 100) > 30) return "";
  const opts = f(hash(x, y, 53) % 89);
  return opts[pick(x, y, 52, opts.length)];
}

// ---------- Welten ----------
// Alle zehn Welten haben ihr Thema; die neutrale Welt bleibt als Rückfall.
const WORLDS = WORLD_LEVELS.map((levels, i) => {
  const theme = ["fussball", "reiten", "pokemon", "lego", "steine", "schlagzeug", "tennis", "essen", "pokemon2", "familie", "garten"][i] || "neutral";
  return { theme, bonus: i === 10, name: (THEMES[theme] && THEMES[theme].worldName) || ["Fußball", "Reiten", "Pokémon", "Lego", "Edelsteine", "Schlagzeug", "Tennis", "Essen", "Pokémon 2", "Familie", "Lasses Garten"][i] || `Welt ${i + 1}`, levels };
});
const PER_WORLD = 9;
// Anzahl Level je Welt: 9, der Bonus-Garten hat eins
const NL = (w) => WORLDS[w].levels.length;
// Gezählt werden nur die 90 Level der zehn Welten; der Bonus-Garten erscheint erst danach als Überraschung
const TOTAL = WORLDS.filter(w => !w.bonus).reduce((n, w) => n + w.levels.length, 0);

// ---------- Spieler (nur auf diesem Gerät) ----------
const STORE = "lasses-welt-v1";
let store = { players: [{ id: "lasse", name: "Lasse", solved: {}, seen: 1 }], current: null };
try {
  const raw = JSON.parse(localStorage.getItem(STORE) || "null");
  if (raw && Array.isArray(raw.players) && raw.players.length) store = raw;
} catch (e) {}
// Fortschritt aus der Zeit mit 9 Leveln pro Welt übernehmen: gleiche Level bleiben geschafft
if (!store.v6) {
  for (const p of store.players) {
    const neu = {};
    for (const [k, v] of Object.entries(p.solved || {})) {
      const [w, l] = k.split("-").map(Number);
      if (w >= 10) { neu["10-" + l] = v; continue; }
      const g = w * 9 + l;
      if (g < 60) neu[`${Math.floor(g / 6)}-${g % 6}`] = v;
    }
    p.solved = neu;
  }
  store.v6 = true;
  try { localStorage.setItem(STORE, JSON.stringify(store)); } catch (e) {}
}
const save = () => { try { localStorage.setItem(STORE, JSON.stringify(store)); } catch (e) {} };
const P = () => store.players.find(p => p.id === store.current) || store.players[0];
const lk = (w, l) => `${w}-${l}`;
const isSolved = (p, w, l) => !!p.solved[lk(w, l)];
const solvedIn = (p, w) => Array.from({ length: NL(w) }, (_, l) => isSolved(p, w, l)).filter(Boolean).length;
const worldOpen = (p, w) => !!p.unlockAll || w === 0 || solvedIn(p, w - 1) === NL(w - 1);
const levelOpen = (p, w, l) => !!p.unlockAll || worldOpen(p, w) && (l === 0 || isSolved(p, w, l - 1));
const totalSolved = (p) => Object.keys(p.solved).filter(k => !WORLDS[+k.split("-")[0]].bonus).length;

const screens = { players: "scr-players", map: "scr-map", levels: "scr-levels", game: "scr-game" };
let screen = "players", curWorld = 0, curLevel = 0;
const DEFAULT_PAL = { "--bg": "#dcecff", "--bg-2": "#f3f8ff", "--ink": "#4a3728", "--muted": "#6a7fa8", "--accent": "#2a6ae0", "--accent-dark": "#1a4bae", "--soft": "#e3edff", "--edge": "#c9daf5", "--floor-a": "#8fdc7c", "--floor-b": "#80d16d" };
function applyPal(pal, cls) {
  document.body.removeAttribute("style");
  for (const [k, v] of Object.entries(pal)) document.body.style.setProperty(k, v);
  document.body.className = cls || "";
}
function show(name) {
  if (name === "levels" && NL(curWorld) === 1) name = "map";
  screen = name;
  for (const [k, id] of Object.entries(screens)) document.getElementById(id).hidden = k !== name;
  if (name === "players") { applyPal(DEFAULT_PAL); renderPlayers(); }
  if (name === "map") { applyPal(DEFAULT_PAL); renderMap(); }
  if (name === "levels") { const th = THEMES[WORLDS[curWorld].theme]; applyPal(th.pal, "theme-" + WORLDS[curWorld].theme); renderLevels(); }
  window.scrollTo(0, 0);
}
document.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => show(b.dataset.go)));

// Startseite
let confirmDel = null;
function renderPlayers() {
  const hero = document.getElementById("hero");
  if (typeof FAMILY_HERO !== "undefined") { hero.classList.add("family"); hero.innerHTML = FAMILY_HERO; } else hero.innerHTML = LASSE.fussball;
  const list = document.getElementById("player-list");
  list.innerHTML = store.players.map(p => `
    <div>
      <div class="player-row">
        <button type="button" class="player" data-id="${p.id}">
          <span class="face">${LASSE.neutral}</span>
          <span class="pname">${esc(p.name)}</span>
          <span class="pprog">${totalSolved(p)} / ${TOTAL}</span>
        </button>
        ${p.id === "lasse" ? "" : `<button type="button" class="del" data-del="${p.id}" aria-label="${esc(p.name)} entfernen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>`}
      </div>
      ${confirmDel === p.id ? `<div class="confirm">${esc(p.name)} mit allem Fortschritt entfernen?
        <button type="button" data-cancel>Nein</button><button type="button" class="danger" data-really="${p.id}">Entfernen</button></div>` : ""}
    </div>`).join("");
  list.querySelectorAll("[data-id]").forEach(b => b.addEventListener("click", () => { store.current = b.dataset.id; save(); show("map"); }));
  list.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", () => { confirmDel = b.dataset.del; renderPlayers(); }));
  list.querySelectorAll("[data-cancel]").forEach(b => b.addEventListener("click", () => { confirmDel = null; renderPlayers(); }));
  list.querySelectorAll("[data-really]").forEach(b => b.addEventListener("click", () => {
    store.players = store.players.filter(p => p.id !== b.dataset.really); confirmDel = null; save(); renderPlayers();
  }));
}
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
document.getElementById("add-form").addEventListener("submit", (e) => {
  e.preventDefault();
  const input = document.getElementById("new-name");
  const name = input.value.trim().slice(0, 20);
  if (!name) { input.focus(); return; }
  const p = { id: "p" + Date.now().toString(36), name, solved: {}, seen: 1 };
  // Test-Zugang: Dieser Name schaltet sofort alle 91 Level frei (ohne sie als geschafft zu zählen)
  if (name.toLowerCase() === "bock3112") { p.unlockAll = true; p.seen = WORLDS.length; }
  store.players.push(p); store.current = p.id; save(); input.value = "";
  show("map");
});

// Weltkarte: Inseln im Zickzack, verbunden durch eine gestrichelte Linie
const MAP_X = [28, 72, 34, 70, 26, 66, 32, 74, 30, 64, 50];
const ROW = 150;
function renderMap() {
  const p = P();
  document.getElementById("map-title").innerHTML = `${esc(p.name)}<small>${totalSolved(p)} von ${TOTAL} Leveln geschafft</small>`;
  const map = document.getElementById("map");
  // Der Bonus ist unsichtbar (auch ohne Wolke), bis die letzte Welt komplett geschafft ist
  const shown = WORLDS.filter((w, i) => !w.bonus || worldOpen(p, i));
  const H = shown.length * ROW;
  map.style.height = H + "px";
  const pts = shown.map((_, i) => [MAP_X[i], i * ROW + 60]);
  const d = pts.map(([x, y], i) => {
    if (!i) return `M${x} ${y}`;
    const [px, py] = pts[i - 1];
    return `C${px} ${py + ROW / 2} ${x} ${y - ROW / 2} ${x} ${y}`;
  }).join(" ");
  const open = shown.map((_, i) => worldOpen(p, i));
  const lastOpen = open.lastIndexOf(true);
  const reveal = lastOpen > 0 && (p.seen || 1) < lastOpen + 1;
  map.innerHTML = `
    <svg class="route" viewBox="0 0 100 ${H}" preserveAspectRatio="none" aria-hidden="true">
      <path d="${d}" fill="none" stroke="var(--edge)" stroke-width="10" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
      <path d="${d}" fill="none" stroke="var(--card)" stroke-width="4" stroke-dasharray="2 12" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    </svg>
    ${shown.map((w, i) => {
      // Verdeckte Welten verraten nichts: kein Bild, kein Name, kein Fortschritt im Seiteninhalt
      const th = THEMES[w.theme], n = solvedIn(p, i);
      const cls = ["world", open[i] ? "" : "locked", i === lastOpen ? "current" : "", reveal && i === lastOpen ? "reveal" : ""].join(" ");
      const showCloud = !open[i] || (reveal && i === lastOpen);
      return `<div class="${cls}" style="left:${pts[i][0]}%;top:${pts[i][1] + 10}px">
        <button type="button" data-w="${i}" ${open[i] ? "" : "disabled"} aria-label="${open[i] ? `Welt ${i + 1}: ${w.name}, ${n} von ${NL(i)} geschafft` : `Welt ${i + 1}: noch verdeckt`}">
          ${open[i] ? `<svg class="icon" viewBox="0 0 100 100"><use href="#${th.box === "kiste" ? "welt" : th.box}"/></svg>` : ""}
          ${open[i] && th.prize && isSolved(p, i, NL(i) - 1) ? `<svg class="badge" viewBox="0 0 100 ${th.prize.symbol === "schleife" ? 128 : 100}"><use href="#${th.prize.symbol}"/></svg>` : ""}
        </button>
        <span class="wname">${w.bonus ? (open[i] ? esc(w.name) : "Bonus") : open[i] ? `${i + 1} · ${esc(w.name)}` : `Welt ${i + 1}`}</span>
        ${open[i] ? `<span class="wprog${n === NL(i) ? " full" : ""}">${n} / ${NL(i)}</span>` : ""}
        ${showCloud ? `<svg class="cloud" viewBox="0 0 170 120" aria-hidden="true"><use href="#wolke"/></svg>` : ""}
      </div>`;
    }).join("")}`;
  map.querySelectorAll("[data-w]").forEach(b => b.addEventListener("click", () => { curWorld = +b.dataset.w; if (NL(curWorld) === 1) loadLevel(curWorld, 0); else show("levels"); }));
  if (reveal) { p.seen = lastOpen + 1; save(); }
}

// Levelauswahl
function renderLevels() {
  const p = P(), w = WORLDS[curWorld], th = THEMES[w.theme];
  document.getElementById("levels-title").innerHTML = `Welt ${curWorld + 1}${w.theme === "neutral" ? "" : ` · ${esc(w.name)}`}<small>${esc(p.name)} · ${solvedIn(p, curWorld)} von ${NL(curWorld)} geschafft</small>`;
  document.getElementById("levels-emblem").setAttribute("href", "#" + th.emblem);
  let next = -1;
  for (let l = 0; l < NL(curWorld); l++) if (levelOpen(p, curWorld, l) && !isSolved(p, curWorld, l)) { next = l; break; }
  document.getElementById("levelgrid").innerHTML = w.levels.map((_, l) => {
    const row = th.scenes && l % PER_DESIGN === 0 && th.scenes[l / PER_DESIGN] ? `<div class="row-name">${esc(th.scenes[l / PER_DESIGN].name)}</div>` : "";
    const prize = th.prize && l === NL(curWorld) - 1;
    const open = levelOpen(p, curWorld, l), done = isSolved(p, curWorld, l);
    const cls = ["lvl", done ? "done" : "", !open ? "locked" : "", l === next ? "next" : ""].join(" ");
    return row + `<button type="button" class="${cls}" data-l="${l}" ${open ? "" : "disabled"} aria-label="Level ${l + 1}${done ? ", geschafft" : open ? "" : ", gesperrt"}">
      ${open ? l + 1 : `<svg viewBox="0 0 24 24"><use href="#schloss"/></svg>`}
      ${open && (th.levelIcon || th.levelBox) && !prize ? `<svg class="lvl-gem" viewBox="0 0 100 100"><use href="#${(th.levelIcon || th.levelBox)(l)}"/></svg>` : ""}
      ${prize ? `<svg class="prize-ico" viewBox="0 0 100 ${th.prize.symbol === "schleife" ? 128 : 100}"><use href="#${th.prize.symbol}"/></svg>`
        : done ? `<svg class="star" viewBox="0 0 100 100"><use href="#stern"/></svg>` : ""}
    </button>`;
  }).join("");
  document.querySelectorAll("#levelgrid [data-l]").forEach(b => b.addEventListener("click", () => loadLevel(curWorld, +b.dataset.l)));
  const n = solvedIn(p, curWorld);
  document.getElementById("levels-hint").textContent = n === NL(curWorld)
    ? (curWorld < WORLDS.length - 1 ? "Alle Level geschafft! Die nächste Welt ist offen." : "Alle Welten geschafft!")
    : "Schaffe ein Level, dann öffnet sich das nächste.";
}

// ---------- Spiel ----------
const key = (x, y) => x + "," + y;
const board = document.getElementById("board");
let L, T, S, W, H, walls, goals, inside, start, startBoxes, goalEls;
let player, boxes, history, moves, pushes, facing, boxEls = [], lasseEl, savedBeforeReset = null;

function parse(rows) {
  W = Math.max(...rows.map(r => r.length)); H = rows.length;
  walls = new Set(); goals = new Set(); inside = new Set(); startBoxes = []; start = null;
  rows.map(r => r.padEnd(W)).forEach((r, y) => [...r].forEach((c, x) => {
    if (c === "#") walls.add(key(x, y));
    if (".*+".includes(c)) goals.add(key(x, y));
    if ("$*".includes(c)) startBoxes.push([x, y]);
    if ("@+".includes(c)) start = [x, y];
  }));
  const st = [start];
  while (st.length) {
    const [x, y] = st.pop(), k = key(x, y);
    if (x < 0 || y < 0 || x >= W || y >= H || walls.has(k) || inside.has(k)) continue;
    inside.add(k); st.push([x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]);
  }
  // Abgeschlossene Kammern (vom Rand nicht erreichbar) bekommen ebenfalls Boden, z. B. Beete mit fertigen Blumen
  const outer = new Set(), os = [];
  for (let x = 0; x < W; x++) os.push([x, 0], [x, H - 1]);
  for (let y = 0; y < H; y++) os.push([0, y], [W - 1, y]);
  while (os.length) {
    const [x, y] = os.pop(), k = key(x, y);
    if (x < 0 || y < 0 || x >= W || y >= H || walls.has(k) || outer.has(k) || inside.has(k)) continue;
    outer.add(k); os.push([x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]);
  }
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { const k = key(x, y); if (!walls.has(k) && !outer.has(k)) inside.add(k); }
}

function loadLevel(w, l, data) {
  curWorld = w; curLevel = l;
  L = WORLDS[w]; T = THEMES[L.theme]; S = T.levelScenes ? T.levelScenes[l] : T.scenes ? T.scenes[Math.min(T.scenes.length - 1, Math.floor(l / PER_DESIGN))] : null;
  // Zusätzliche Wandteile untermischen (rund 40 %), damit sich kein Schauplatz wiederholt
  if (S && EXTRA_WALLS[S.name]) { const base = S, ex = EXTRA_WALLS[S.name]; S = { ...base, wall: (x, y) => pick(x, y, 77, 10) < 4 ? ex[pick(x, y, 78, ex.length)](x, y) : base.wall(x, y) }; }
  show("game");
  applyPal({ ...T.pal, ...(S ? S.pal : {}) }, "theme-" + L.theme);
  const finale = !!T.prize && l === L.levels.length - 1;
  document.getElementById("emblem").setAttribute("href", "#" + T.emblem);
  const we = document.getElementById("win-emblem");
  we.setAttribute("href", "#" + (finale ? T.prize.symbol : T.emblem));
  we.parentNode.setAttribute("viewBox", finale && T.prize.symbol === "schleife" ? "0 0 100 128" : "0 0 100 100");
  document.querySelector(".win-card").classList.toggle("prize", finale);
  document.getElementById("game-player").textContent = P().name;
  const lname = T.levelName ? T.levelName(l) : (S ? S.name : "");
  document.getElementById("subtitle").textContent = `${L.bonus ? "Bonus" : "Welt " + (w + 1)}${lname ? " · " + lname : ""}${L.bonus ? "" : ` · Level ${l + 1}${finale ? " · Finale" : ""}`}`;
  document.getElementById("push-word").textContent = T.pushWord;
  document.getElementById("hint").textContent = typeof T.hint === "function" ? T.hint(l) : T.hint;
  document.getElementById("win-title").textContent = finale ? T.prize.title : (typeof T.winTitle === "function" ? T.winTitle(l) : T.winTitle);
  parse(L.levels[l].m);
  board.style.setProperty("--w", W); board.style.setProperty("--h", H);
  for (const k of ["--g1", "--g2", "--g3"]) board.style.removeProperty(k);
  if (T.levelVars) for (const [k, v] of Object.entries(T.levelVars(l))) board.style.setProperty(k, v);
  sizeTiles(); buildBoard();
  savedBeforeReset = null;
  reset(data);
}

function buildBoard() {
  let html = "";
  const xs = [...inside].map(k => +k.split(",")[0]), ys = [...inside].map(k => +k.split(",")[1]);
  const ctx = { mid: Math.round((Math.min(...xs) + Math.max(...xs)) / 2), midY: Math.round((Math.min(...ys) + Math.max(...ys)) / 2) };
  const mood = moodOf(L.theme, S ? S.name : "");
  const free = (x, y) => !inside.has(key(x, y)) && !(walls.has(key(x, y)) && touchesInside(x, y));
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const pos = `style="--x:${x};--y:${y}"`;
    if (inside.has(key(x, y))) {
      html += S ? `<div class="tile" ${pos}>${S.floor(x, y, ctx)}</div>` : `<div class="tile floor${(x + y) % 2 ? " b" : ""}" ${pos}></div>`;
      const fd = floorDetail(mood, x, y);
      if (fd) html += `<div class="tile detail" ${pos}><svg viewBox="0 0 100 100">${fd}</svg></div>`;
    }
    else if (S && free(x, y)) { const d = S.deco(x, y); if (d) html += `<div class="tile deco" ${pos}>${d}</div>`; }
  }
  // Trainer: freies Feld außerhalb, möglichst unten rechts und direkt an der Wand
  if (S && S.special === "trainer") {
    let best = null;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      if (!free(x, y)) continue;
      const nearWall = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => walls.has(key(x + dx, y + dy)));
      const score = (nearWall ? 100 : 0) + x + y;
      if (!best || score > best[2]) best = [x, y, score];
    }
    if (best) html = html.replace(new RegExp(`<div class="tile deco" style="--x:${best[0]};--y:${best[1]}">.*?</svg></div>`), "")
      + `<div class="tile deco" style="--x:${best[0]};--y:${best[1]}">${TRAINER}</div>`;
  }
  const wallHtml = {};
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const k = key(x, y), pos = `style="--x:${x};--y:${y}"`;
    // Nur Wände zeigen, die an das Spielfeld grenzen; abgeschlossene Wandinseln außen weglassen
    if (walls.has(k) && touchesInside(x, y)) {
      // Gleiche Wandteile nicht direkt neben- oder übereinander: notfalls eine andere Variante ziehen
      const fn = S ? S.wall : T.wall;
      let w = fn(x, y);
      for (const [dx, dy] of [[13, 7], [29, 17], [41, 3], [57, 23]]) {
        if (w !== wallHtml[key(x - 1, y)] && w !== wallHtml[key(x, y - 1)]) break;
        w = fn(x + dx, y + dy);
      }
      wallHtml[k] = w;
      html += `<div class="tile wall" ${pos}>${w}</div>`;
      const wd = wallDetail(mood, x, y);
      if (wd) html += `<div class="tile detail" ${pos}><svg viewBox="0 0 100 100">${wd}</svg></div>`;
    }
    if (goals.has(k)) html += `<div class="tile target" data-k="${k}" ${pos}>${T.target(curLevel)}</div>`;
  }
  if (T.levelName) html += signHTML(T.levelName(curLevel));
  board.innerHTML = html;
  const side = (S && S.side) || null, arena = document.querySelector(".arena");
  if (arena) {
    arena.classList.toggle("has-side", !!side);
    const fig = (list) => (list || []).map((s, i) => s.replace("<svg ", `<svg class="bobside" style="animation-delay:${-i * .7}s" `)).join("");
    document.getElementById("side-l").innerHTML = side ? fig(side.l) : "";
    document.getElementById("side-r").innerHTML = side ? fig(side.r) : "";
    arena.style.setProperty("--side-l", side ? side.l.length : 0); arena.style.setProperty("--side-r", side ? side.r.length : 0);
  }
  const extras = S && S.extras ? S.extras() : "";
  document.getElementById("deco").innerHTML = extras;
  document.querySelector(".stage").classList.toggle("has-bunting", extras.includes("bunting"));
  goalEls = {};
  board.querySelectorAll(".target").forEach(el => goalEls[el.dataset.k] = el);
  const slots = document.getElementById("slots");
  slots.classList.toggle("many", goals.size > 5);
  slots.innerHTML = [...goals].map(() => `<span class="slot"><svg viewBox="0 0 100 100"><use href="#${T.boxIn || boxId()}"/></svg></span>`).join("");
}
// Schild mit dem Namen des Fundorts: auf der längsten sichtbaren Wandreihe, bevorzugt oben
function signHTML(text) {
  let best = null;
  for (let y = 0; y < H; y++) {
    let x = 0;
    while (x < W) {
      if (walls.has(key(x, y)) && touchesInside(x, y)) {
        let e = x; while (e + 1 < W && walls.has(key(e + 1, y)) && touchesInside(e + 1, y)) e++;
        const len = Math.min(e - x + 1, 6), score = len * 10 - y;
        if (len >= 2 && (!best || score > best.score)) best = { x: x + Math.floor((e - x + 1 - len) / 2), y, len, score };
        x = e + 1;
      } else x++;
    }
  }
  if (!best) return "";
  const fs = Math.min(.42, best.len / (text.length * .6)).toFixed(3);
  return `<div class="sign" style="left:calc(${best.x} * var(--t) + 4px);top:calc(${best.y} * var(--t) + var(--t) * .18);width:calc(${best.len} * var(--t) - 8px);height:calc(var(--t) * .62);font-size:calc(var(--t) * ${fs})">${esc(text)}</div>`;
}
function touchesInside(x, y) {
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) if (inside.has(key(x + dx, y + dy))) return true;
  return false;
}

function reset(data) {
  player = data?.player ? [...data.player] : [...start];
  boxes = data?.boxes ? data.boxes.map(b => ({ ...b })) : startBoxes.map(([x, y], id) => ({ id, x, y, rot: 0 }));
  history = []; moves = data?.moves ?? 0; pushes = data?.pushes ?? 0; facing = 1;
  document.getElementById("win").hidden = true;
  makeSprites(); render();
}

function makeSprites() {
  board.querySelectorAll(".sprite").forEach(el => el.remove());
  boxEls = boxes.map((b, i) => {
    const el = document.createElement("div");
    el.className = "sprite box";
    if (T.boxColors) { const [c, m] = T.boxColors[i % T.boxColors.length]; el.style.setProperty("--c1", c); el.style.setProperty("--c2", m); }
    const cyc = T.boxCycle && T.boxCycle(curLevel);
    el.innerHTML = `<div class="squash"><div class="spin"><svg viewBox="0 0 100 100"><use href="#${cyc ? cyc[i % cyc.length] : boxId()}"/></svg></div></div>`;
    board.appendChild(el); return el;
  });
  lasseEl = document.createElement("div");
  lasseEl.className = "sprite"; lasseEl.id = "lasse";
  lasseEl.innerHTML = `<div class="face-dir">${LASSE[(S && S.lasse) || L.theme]}</div>`;
  board.appendChild(lasseEl);
  // Kisten, die schon im Ziel starten, nicht beim Aufbau hüpfen lassen
  boxes.forEach((b, i) => { if (goals.has(key(b.x, b.y))) boxEls[i].classList.add("in"); });
}

const boxId = () => T.levelBox ? T.levelBox(curLevel) : T.box;
const boxAt = (x, y) => boxes.find(b => b.x === x && b.y === y);
function render() {
  lasseEl.style.setProperty("--x", player[0]); lasseEl.style.setProperty("--y", player[1]);
  lasseEl.querySelector(".face-dir").style.transform = `scaleX(${facing})`;
  let scored = 0;
  const hit = new Set();
  boxes.forEach((b, i) => {
    const el = boxEls[i], k = key(b.x, b.y);
    el.style.setProperty("--x", b.x); el.style.setProperty("--y", b.y); el.style.setProperty("--rot", b.rot + "deg");
    const isIn = goals.has(k);
    if (isIn) { scored++; hit.add(k); }
    el.classList.toggle("in", isIn);
    if (T.boxIn) el.querySelector("use").setAttribute("href", "#" + (isIn ? T.boxIn : boxId()));
  });
  for (const k in goalEls) goalEls[k].classList.toggle("hit", hit.has(k));
  document.querySelectorAll(".slot").forEach((s, i) => s.classList.toggle("on", i < scored));
  document.getElementById("slots").setAttribute("aria-label", `${scored} von ${goals.size} ${T.boxWord}`);
  requestAnimationFrame(follow);
  document.getElementById("moves").textContent = moves;
  document.getElementById("pushes").textContent = pushes;
  const won = scored === goals.size, winEl = document.getElementById("win");
  if (won && !lasseEl.classList.contains("cheer")) {
    lasseEl.classList.add("cheer");
    const p = P(), k = lk(curWorld, curLevel), best = p.solved[k];
    if (!best || moves < best.m) p.solved[k] = { m: moves, p: pushes };
    save();
    document.getElementById("win-text").textContent = T.prize && curLevel === NL(curWorld) - 1 ? T.prize.text(moves) : T.winText(moves, pushes, curLevel);
    const nextBtn = document.getElementById("next");
    if (curLevel < NL(curWorld) - 1) nextBtn.textContent = `Weiter: Level ${curLevel + 2}`;
    else nextBtn.textContent = curWorld < WORLDS.length - 1 ? "Zur Weltkarte" : "Fertig!";
    const w = curWorld, l = curLevel;
    setTimeout(() => { if (w === curWorld && l === curLevel && lasseEl.classList.contains("cheer")) { winEl.hidden = false; confetti(); } }, 450);
  } else if (!won) { winEl.hidden = true; lasseEl.classList.remove("cheer"); }
}

function follow() {
  const stage = document.querySelector(".stage");
  const sides = [...document.querySelectorAll(".side")].reduce((n, el) => n + el.offsetWidth, 0);
  const wide = board.scrollWidth > stage.parentElement.clientWidth - sides - 8;
  stage.classList.toggle("wide", wide);
  if (!wide) return;
  const t = board.clientWidth / W;
  const won = !document.getElementById("win").hidden || lasseEl.classList.contains("cheer");
  const left = won ? 0 : player[0] * t - stage.clientWidth / 2 + t / 2;
  stage.scrollTo({ left: Math.max(0, left), behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
}
function pulse(el, cls, others) {
  el.classList.remove(cls, ...(others || []));
  void el.offsetWidth;
  el.classList.add(cls);
}

const DIRS = { u: [0, -1], d: [0, 1], l: [-1, 0], r: [1, 0] };
function step(d) {
  if (screen !== "game" || lasseEl.classList.contains("cheer")) return;
  const [dx, dy] = DIRS[d];
  const nx = player[0] + dx, ny = player[1] + dy;
  if (dx) facing = dx;
  if (walls.has(key(nx, ny))) { render(); return; }
  const snap = { player: [...player], boxes: boxes.map(b => ({ ...b })), moves, pushes };
  const b = boxAt(nx, ny);
  if (b) {
    const bx = nx + dx, by = ny + dy;
    if (walls.has(key(bx, by)) || boxAt(bx, by)) { render(); return; }
    b.x = bx; b.y = by;
    if (typeof T.rolls === "function" ? T.rolls(curLevel) : T.rolls) b.rot += (dx || dy) * 180; // Ball: eine Feldlänge ≈ halbe Umdrehung
    else pulse(boxEls[boxes.indexOf(b)], T.squish ? "squish" : "shove");
    pushes++;
  }
  history.push(snap);
  player = [nx, ny]; moves++;
  pulse(lasseEl, b ? "kick" : "hop", ["hop", "kick"]);
  render();
}
function undo() {
  const s = history.pop(); if (!s) return;
  player = s.player; moves = s.moves; pushes = s.pushes;
  s.boxes.forEach((sb, i) => Object.assign(boxes[i], sb));
  pulse(lasseEl, "hop", ["hop", "kick"]); render();
}

function confetti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const box = document.getElementById("confetti");
  box.innerHTML = Array.from({ length: 40 }, (_, i) => {
    const dx = (Math.random() - .5) * 360, dy = 120 + Math.random() * 220, r = (Math.random() - .5) * 900;
    return `<span class="bit" style="left:${45 + (Math.random() - .5) * 20}%;background:${T.confetti[i % T.confetti.length]};--dx:${dx}px;--dy:${dy}px;--r:${r}deg;animation-delay:${Math.random() * 150}ms;box-shadow:0 0 0 1px #00000018"></span>`;
  }).join("");
  setTimeout(() => box.innerHTML = "", 1800);
}

document.addEventListener("keydown", (e) => {
  if (screen !== "game" || e.target.tagName === "INPUT") return;
  const map = { ArrowUp: "u", ArrowDown: "d", ArrowLeft: "l", ArrowRight: "r", w: "u", s: "d", a: "l", d: "r" };
  if (map[e.key]) { e.preventDefault(); step(map[e.key]); }
  else if (e.key === "z" || e.key === "Backspace") document.getElementById("undo").click();
});
document.querySelectorAll(".pad button").forEach(b => b.addEventListener("click", () => step(b.dataset.d)));
document.getElementById("undo").addEventListener("click", () => {
  // Nach einem Neustart holt „Zurück“ den alten Stand wieder
  if (!history.length && savedBeforeReset) { const s = savedBeforeReset; savedBeforeReset = null; reset(s); return; }
  undo();
});
document.getElementById("reset").addEventListener("click", () => {
  if (moves) savedBeforeReset = { player: [...player], boxes: boxes.map(b => ({ ...b })), moves, pushes };
  reset();
});
document.getElementById("again").addEventListener("click", () => { savedBeforeReset = null; reset(); });
document.getElementById("next").addEventListener("click", () => {
  if (curLevel < NL(curWorld) - 1) loadLevel(curWorld, curLevel + 1);
  else show("map");
});

let touch = null;
board.addEventListener("pointerdown", (e) => { touch = [e.clientX, e.clientY]; });
board.addEventListener("pointerup", (e) => {
  if (!touch) return;
  const dx = e.clientX - touch[0], dy = e.clientY - touch[1]; touch = null;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
  step(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "r" : "l") : (dy > 0 ? "d" : "u"));
});

function sizeTiles() {
  if (!W) return;
  const arena = document.querySelector(".arena"), hasSide = !!(S && S.side);
  const sideW = hasSide ? Math.round(Math.min(84, Math.max(44, window.innerWidth * .13))) : 0;
  if (arena) arena.style.setProperty("--side-w", sideW + "px");
  const nSide = hasSide ? (1 + .45 * (S.side.l.length - 1)) + (1 + .45 * (S.side.r.length - 1)) : 0;
  const avail = Math.min(window.innerWidth - 32, 720) - (hasSide ? Math.round(nSide * sideW) + 8 : 0);
  board.style.setProperty("--t", Math.max(26, Math.min(64, Math.floor(avail / W))) + "px");
}
window.addEventListener("resize", sizeTiles);

window.claude?.hot?.snapshot?.(() => ({ screen, curWorld, curLevel, game: screen === "game" ? { player, boxes, moves, pushes } : null }));
function boot(data) {
  if (data && data.screen === "game" && data.game) return loadLevel(data.curWorld, data.curLevel, data.game);
  if (data && data.screen && data.screen !== "game") { curWorld = data.curWorld || 0; return show(data.screen); }
  show("players");
}
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>

<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});</script>
