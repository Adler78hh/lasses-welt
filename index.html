<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2a6ae0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lasses Welt">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
</head>
<body>
<title>Lasses Welt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: vier Bildschirme nacheinander – Spieler, Weltkarte (Inseln an einer Linie, verdeckt von Wolken), Levelauswahl (3×3 Zahlen), Spiel.
   Bewusst ein einziges helles Thema (Kinderspiel). Jede Welt setzt ihre eigenen Farb-Tokens auf <body>. */
:root {
  --bg: #dcecff;         /* Seitenhintergrund */
  --bg-2: #f3f8ff;
  --card: #ffffff;
  --ink: #4a3728;        /* Schrift, Konturen */
  --muted: #6a7fa8;
  --accent: #2a6ae0;
  --accent-dark: #1a4bae;
  --soft: #e3edff;
  --edge: #c9daf5;       /* Kartenkante */
  --floor-a: #8fdc7c;
  --floor-b: #80d16d;
  --black: #16181f;
  --white: #ffffff;
  --sun: #ffcc33;
  --red: #ef4b4b;
  --display: "Fredoka", "Baloo 2", "Trebuchet MS", sans-serif;
  --body: "Nunito", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { min-height: 100%; }
/* Kein Markieren, kein Lupen-/Kopiermenü, kein Doppeltipp-Zoom, kein grauer Tipp-Blitz */
* { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
input, textarea { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
img, svg { -webkit-user-drag: none; }
body {
  background: radial-gradient(90% 60% at 50% 0%, var(--bg-2) 0%, var(--bg) 70%) var(--bg);
  background-attachment: fixed;
  color: var(--ink);
  font-family: var(--body);
  padding-inline: 16px;
  padding-block: 16px 24px;
  box-sizing: border-box;
  overflow-x: hidden;
}
.wrap { max-width: 720px; margin-inline: auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; justify-items: center; }
.screen { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; justify-items: center; }

button { font: inherit; cursor: pointer; border: 0; color: var(--ink); background: var(--card); border-radius: 999px;
  font-family: var(--display); font-weight: 600; box-shadow: 0 4px 0 var(--edge); transition: transform 80ms, box-shadow 80ms; }
button:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--edge); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
button:disabled { cursor: default; }
.primary { background: var(--accent); color: var(--white); box-shadow: 0 4px 0 var(--accent-dark); }
.primary:active:not(:disabled) { box-shadow: 0 1px 0 var(--accent-dark); }

/* Kopfzeile der Unterseiten */
.topbar { width: 100%; display: flex; align-items: center; gap: 12px; }
.topbar h2 { margin: 0; flex: 1 1 auto; min-width: 0; font-family: var(--display); font-weight: 700; font-size: 24px; line-height: 1.1; text-wrap: balance; }
.topbar h2 small { display: block; font-family: var(--body); font-size: 13px; font-weight: 700; color: var(--muted); }
/* Text direkt auf dem Seitenhintergrund: auf dunklen Welten hell */
.topbar h2 { color: var(--on-bg-strong, var(--ink)); }
.topbar h2 small, .levelgrid .row-name { color: var(--on-bg, var(--muted)); }
.back { padding: 8px 14px; font-size: 15px; display: flex; align-items: center; gap: 6px; flex: none; }
.back svg { width: 16px; height: 16px; }

/* ---------- Startseite: Spieler ---------- */
.title { text-align: center; display: grid; gap: 6px; justify-items: center; padding-block: 8px 4px; }
.title h1 { margin: 0; font-family: var(--display); font-weight: 700; font-size: clamp(38px, 11vw, 60px); line-height: 1; color: var(--accent); letter-spacing: .01em; }
.title p { margin: 0; color: var(--muted); font-weight: 700; }
.title .hero { width: 120px; height: 120px; }
.title .hero .body { transform-origin: 50% 92%; transform-box: view-box; animation: idle 1.6s ease-in-out infinite; }
.title .hero.family { width: min(560px, 100%); height: auto; aspect-ratio: 506 / 270; position: relative; }
.title .hero.family > svg { width: 100%; height: 100%; display: block; overflow: visible; }
.title .hero.family::after { content: ""; position: absolute; left: 6%; right: 6%; bottom: -1%; height: 5%; border-radius: 50%; background: #2a3f8418; z-index: -1; }
.title .hero.family > img { width: 100%; height: 100%; display: block; }
.fam-bob { transform-box: fill-box; transform-origin: 50% 100%; animation: fambob 3.2s ease-in-out infinite; }
@keyframes fambob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1.5px); } }
@media (prefers-reduced-motion: reduce) { .fam-bob { animation: none !important; } }
.title .hero .eyes { transform-origin: 50% 36%; transform-box: view-box; animation: blink 3.8s infinite; }
.players { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.player { display: flex; align-items: center; gap: 12px; padding: 10px 16px 10px 10px; border-radius: 22px; text-align: left; flex: 1 1 auto; min-width: 0; }
.player .face { width: 54px; height: 54px; flex: none; border-radius: 50%; background: var(--soft); overflow: hidden; }
.player .face svg { width: 100%; height: 100%; transform: scale(1.7) translateY(14%); }
.player .pname { flex: 1 1 auto; min-width: 0; font-size: 22px; font-weight: 700; overflow-wrap: anywhere; }
.player .pprog { font-family: var(--body); font-size: 13px; font-weight: 800; color: var(--muted); white-space: nowrap; }
.player-row { display: flex; gap: 8px; align-items: stretch; }
.player-row .del { flex: none; width: 46px; border-radius: 16px; color: var(--muted); display: grid; place-items: center; }
.player-row .del svg { width: 18px; height: 18px; }
.confirm { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: flex-end; padding: 4px 4px 0; font-weight: 700; color: var(--muted); }
.confirm button { padding: 6px 14px; font-size: 15px; }
.confirm .danger { background: var(--red); color: var(--white); box-shadow: 0 4px 0 #b83434; }
.add { width: 100%; display: flex; gap: 8px; }
.add input { flex: 1 1 auto; min-width: 0; font: inherit; font-weight: 700; font-size: 17px; border: 0; border-radius: 999px; padding: 12px 18px; background: var(--card); color: var(--ink); box-shadow: inset 0 2px 0 var(--edge); }
.add button { padding: 10px 18px; font-size: 17px; flex: none; }
.credit { font-size: 12px; color: var(--muted); text-align: center; line-height: 1.5; margin: 6px 0 0; max-width: 46ch; }

/* ---------- Weltkarte ---------- */
.map { position: relative; width: 100%; max-width: 460px; }
.map svg.route { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.world { position: absolute; transform: translate(-50%, -50%); display: grid; justify-items: center; gap: 4px; width: 132px; }
.world button { width: 96px; height: 96px; border-radius: 50%; display: grid; place-items: center; position: relative; box-shadow: 0 6px 0 var(--edge), 0 10px 24px #00000014; }
.world button svg.icon { width: 58px; height: 58px; }
.world .wname { font-family: var(--display); font-weight: 700; font-size: 16px; text-align: center; line-height: 1.1; }
.world .wprog { font-size: 12px; font-weight: 800; color: var(--muted); }
.world .wprog.full { color: var(--accent); }
.cloud { position: absolute; left: 50%; top: 44px; width: 170px; height: 120px; transform: translate(-50%, -50%); pointer-events: none; }
.world.locked button { box-shadow: none; background: transparent; }
.world.locked .icon, .world.locked .wprog { visibility: hidden; }
.world.reveal .cloud { animation: lift 1.4s ease-in forwards; }
@keyframes lift { 0% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 30% { transform: translate(-50%, -55%) scale(1.06); } 100% { opacity: 0; transform: translate(-50%, -120%) scale(1.4); } }
.world.current button::after { content: ""; position: absolute; inset: -8px; border-radius: 50%; border: 3px dashed var(--accent); animation: spin 8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- Levelauswahl ---------- */
.levelgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 110px)); gap: 14px; justify-content: center; width: 100%; }
.lvl { aspect-ratio: 1; max-width: 100%; border-radius: 24px; font-size: 36px; font-weight: 700; position: relative; display: grid; place-items: center; }
.lvl.done { background: var(--soft); }
.lvl .lvl-star { position: absolute; left: -8px; top: -8px; width: 34px; height: 34px; filter: drop-shadow(0 2px 2px #0002); }
.win-star { margin: 4px 0 0; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 800; font-size: 14px; color: var(--ink); }
.win-star svg { width: 34px; height: 34px; flex: none; animation: starpop 600ms cubic-bezier(.3,1.8,.5,1) both; }
@keyframes starpop { from { transform: scale(0) rotate(-40deg); } to { transform: scale(1) rotate(0); } }
.side .bobside.jubel { animation: jubelhop .42s ease-in-out infinite alternate; }
@keyframes jubelhop { from { transform: translateY(0); } to { transform: translateY(-14%); } }
#sound .cross { display: none; } #sound.off .cross { display: inline; } #sound.off .wave { display: none; } #sound.off { opacity: .6; }
.icon-btn { padding-inline: 12px; } .icon-btn svg { margin: 0; }
.lvl.locked { background: color-mix(in srgb, var(--card) 45%, transparent); color: color-mix(in srgb, var(--muted) 60%, transparent); box-shadow: none; }
.lvl.locked svg { width: 28px; height: 28px; }
.lvl.next { background: var(--accent); color: var(--white); box-shadow: 0 4px 0 var(--accent-dark); }
.lvl-hint { margin: 0; text-align: center; color: var(--muted); font-weight: 700; font-size: 14px; }

/* ---------- Spiel ---------- */
.head { width: 100%; box-sizing: border-box; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  background: var(--card); border-radius: 22px; padding: 12px 16px; box-shadow: 0 6px 0 var(--edge), 0 14px 30px #0000000f; }
.emblem { width: 44px; height: 44px; flex: none; display: block; }
.who { flex: 1 1 auto; min-width: 0; }
.who h1 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 24px; line-height: 1; overflow-wrap: anywhere; }
.who p { margin: 4px 0 0; font-size: 13px; font-weight: 700; color: var(--muted); }
.slots { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.slot { width: 34px; height: 34px; border-radius: 50%; background: var(--soft); box-shadow: inset 0 2px 0 var(--edge); display: grid; place-items: center; }
.slots.many .slot { width: 22px; height: 22px; }
.slot svg { width: 82%; height: 82%; transform: scale(0); transition: transform 300ms cubic-bezier(.3,1.8,.5,1); }
.slot.on svg { transform: scale(1); }

.bar { width: 100%; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.stats { display: flex; gap: 8px; }
.chip { background: var(--card); border-radius: 999px; padding: 6px 12px; font-weight: 800; font-size: 13px; color: var(--muted); box-shadow: 0 3px 0 var(--edge); }
.chip b { color: var(--ink); font-variant-numeric: tabular-nums; font-size: 15px; margin-left: 4px; }
.actions { display: flex; gap: 8px; }
.actions button { padding: 8px 14px; font-size: 15px; display: flex; align-items: center; gap: 6px; }
.actions svg { width: 16px; height: 16px; }

.stage { position: relative; max-width: 100%; }
.stage.zoomed { overflow: hidden; max-width: none; }
#board.pinching .sprite, #board.pinching .box .spin { transition: none; }
/* Gäste, die neben dem Spielfeld stehen (z. B. beim Grillfest) */
.arena { width: 100%; display: flex; align-items: flex-end; justify-content: center; gap: 4px; }
.arena .stage { flex: 0 1 auto; min-width: 0; }
.side { flex: none; width: 0; align-self: flex-end; }
.arena.has-side .side { display: flex; align-items: flex-end; }
.arena.has-side #side-l { width: calc(var(--side-w) * (1 + .45 * (var(--side-l) - 1))); }
.arena.has-side #side-r { width: calc(var(--side-w) * (1 + .45 * (var(--side-r) - 1))); }
/* Personen stehen unter dem Spielfeld nebeneinander, damit das Spielfeld die volle Breite bekommt */
.arena.has-side { display: grid; grid-template-columns: 1fr 1fr; column-gap: 18px; row-gap: 6px; align-items: end; }
.arena.has-side .stage { grid-row: 1; grid-column: 1 / -1; justify-self: center; }
.arena.has-side .side { width: auto; }
.side svg[data-kid] + svg[data-kid] { margin-left: calc(var(--side-w) * -.3); }
.arena.has-side #side-l { grid-row: 2; grid-column: 1; justify-self: end; } .arena.has-side #side-r { grid-row: 2; grid-column: 2; justify-self: start; }
.side svg { width: var(--side-w); flex: none; height: auto; display: block; overflow: visible; }
.side svg + svg { margin-left: calc(var(--side-w) * -.55); }
.side .bobside { animation: idle 2.2s ease-in-out infinite; transform-origin: 50% 98%; transform-box: view-box; }
@media (prefers-reduced-motion: reduce) { .side .bobside { animation: none !important; } }
#board { position: relative; width: calc(var(--w) * var(--t)); height: calc(var(--h) * var(--t)); touch-action: none; user-select: none; -webkit-user-select: none; }
.tile { position: absolute; width: var(--t); height: var(--t); left: calc(var(--x) * var(--t)); top: calc(var(--y) * var(--t)); }
.tile svg, .sprite svg { width: 100%; height: 100%; display: block; overflow: visible; }
.floor { background: var(--floor-a); }
.floor.b { background: var(--floor-b); }
.theme-reiten .floor { background-image: radial-gradient(circle at 25% 30%, #c9a46a55 0 1.5px, transparent 2px), radial-gradient(circle at 70% 65%, #c9a46a55 0 1.5px, transparent 2px), radial-gradient(circle at 55% 20%, #ffffff66 0 1px, transparent 1.5px); }
.sprite { position: absolute; left: 0; top: 0; width: var(--t); height: var(--t);
  transform: translate(calc(var(--x) * var(--t)), calc(var(--y) * var(--t)));
  transition: transform 170ms cubic-bezier(.3,.7,.4,1); will-change: transform; }

.box .spin { width: 100%; height: 100%; transform: rotate(var(--rot)); transition: transform 170ms cubic-bezier(.3,.7,.4,1); }
.box .squash { width: 100%; height: 100%; transform-origin: 50% 80%; }
.box.in .squash { animation: boing 420ms cubic-bezier(.3,1.6,.5,1); }
.box.shove .squash { animation: shove 200ms ease-out; }
@keyframes boing { 0% { transform: scale(1); } 30% { transform: scale(1.18, .82); } 60% { transform: scale(.92, 1.08); } 100% { transform: scale(1); } }
.box.squish .squash { animation: squish 380ms cubic-bezier(.3,1.5,.5,1); }
.theme-reiten .box:not(.squish):not(.in) .squash { animation: breathe 2.4s ease-in-out infinite; }
@keyframes squish { 0% { transform: scale(1); } 25% { transform: scale(1.28, .74); } 55% { transform: scale(.88, 1.14); } 80% { transform: scale(1.05, .96); } 100% { transform: scale(1); } }
@keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04, .96); } }
@keyframes shove { 0% { transform: rotate(0); } 35% { transform: rotate(-6deg) scale(1.05, .95); } 70% { transform: rotate(4deg); } 100% { transform: rotate(0); } }

.target .glow { transition: fill 250ms, opacity 250ms; }
.target .fx { opacity: 0; transform-origin: 50% 50%; transform-box: fill-box; }
.target.hit .fx { animation: twinkle 800ms ease-out; }
@keyframes twinkle { 0% { opacity: 0; transform: translateY(6px) scale(.4); } 40% { opacity: 1; transform: translateY(-2px) scale(1.1); } 100% { opacity: 0; transform: translateY(-10px) scale(1.2); } }
.theme-fussball .target.hit .glow { fill: #fff3b8; }
.theme-reiten .target .glow, .theme-neutral .target .glow { opacity: 0; }
.theme-reiten .target.hit .glow, .theme-neutral .target.hit .glow { opacity: 1; }

.horse .ears { transform-origin: 50% 30%; transform-box: view-box; animation: ears 5s ease-in-out infinite; }
.horse .h-eyes { transform-origin: 50% 36%; transform-box: view-box; animation: blink 4.6s infinite; }
@keyframes ears { 0%, 80%, 100% { transform: rotate(0); } 84% { transform: rotate(-6deg); } 88% { transform: rotate(5deg); } 92% { transform: rotate(0); } }

#lasse { z-index: 3; }
#lasse .face-dir { width: 100%; height: 100%; transition: transform 120ms; }
#lasse svg { transform: scale(1.18); transform-origin: 50% 90%; }
#lasse .body { transform-origin: 50% 92%; transform-box: view-box; animation: idle 1.6s ease-in-out infinite; }
#lasse.hop .body { animation: hop 200ms ease-out, idle 1.6s ease-in-out 200ms infinite; }
#lasse.kick .body { animation: kick 220ms ease-out, idle 1.6s ease-in-out 220ms infinite; }
#lasse.cheer .body { animation: cheer 600ms ease-in-out infinite; }
#lasse .eyes { transform-origin: 50% 36%; transform-box: view-box; animation: blink 3.8s infinite; }
#lasse .shadow { transform-origin: 50% 93%; transform-box: view-box; animation: shadow 1.6s ease-in-out infinite; }
@keyframes idle { 0%,100% { transform: translateY(0) scale(1, 1); } 50% { transform: translateY(-2px) scale(1.02, .98); } }
@keyframes hop { 0% { transform: scale(1.08, .9); } 45% { transform: translateY(-12px) scale(.95, 1.06); } 100% { transform: translateY(0) scale(1); } }
@keyframes kick { 0% { transform: rotate(0); } 40% { transform: rotate(10deg) translateX(5px); } 100% { transform: rotate(0); } }
@keyframes cheer { 0%,100% { transform: translateY(0) scale(1.05, .95); } 50% { transform: translateY(-20px) scale(.96, 1.05); } }
@keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
@keyframes shadow { 0%,100% { transform: scale(1); } 50% { transform: scale(.9); } }

.win { position: absolute; inset: -8px; display: grid; place-items: center; background: color-mix(in srgb, var(--bg) 80%, transparent); border-radius: 24px; z-index: 5; }
.win-card { background: var(--card); border-radius: 26px; padding: 22px 26px; display: grid; gap: 8px; justify-items: center; text-align: center;
  box-shadow: 0 8px 0 var(--edge), 0 20px 40px #00000022; animation: pop 500ms cubic-bezier(.3,1.7,.5,1); max-width: 86%; }
.win-card .emblem { width: 64px; height: 64px; }
.win h3 { margin: 0; font-family: var(--display); font-weight: 700; font-size: clamp(40px, 12vw, 68px); line-height: .95; color: var(--accent); letter-spacing: .02em; text-wrap: balance; }
.win p { margin: 0; font-weight: 700; color: var(--muted); }
.win-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 6px; }
.win-actions button { padding: 10px 20px; font-size: 17px; }
@keyframes pop { from { transform: scale(.4); opacity: 0; } }
#confetti { position: absolute; inset: 0; pointer-events: none; z-index: 6; }
.bit { position: absolute; top: 30%; width: 9px; height: 14px; border-radius: 3px; animation: fall 1.4s cubic-bezier(.2,.6,.4,1) forwards; }
@keyframes fall { from { transform: translate(0, 0) rotate(0); opacity: 1; } to { transform: translate(var(--dx), var(--dy)) rotate(var(--r)); opacity: 0; } }

.pad-zone { padding-top: 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.pad-zone.no-pad .pad { display: none; }
.pad-toggle { font-size: 12px; padding: 4px 12px; min-height: 0; border-radius: 999px; opacity: .75; box-shadow: none; }
.pad { display: grid; grid-template-columns: repeat(3, 58px); grid-template-rows: repeat(3, 58px); gap: 6px; }
.pad button { border-radius: 18px; color: var(--accent); display: grid; place-items: center; }
.pad button svg { width: 24px; height: 24px; }
.pad button[data-d="u"] { grid-area: 1 / 2; } .pad button[data-d="l"] { grid-area: 2 / 1; }
.pad button[data-d="r"] { grid-area: 2 / 3; } .pad button[data-d="d"] { grid-area: 3 / 2; }
.hint { font-size: 13px; color: var(--muted); text-align: center; max-width: 44ch; line-height: 1.5; margin: 0; }

@media (prefers-reduced-motion: reduce) {
  .sprite, .box .spin { transition: none; }
  #lasse .body, #lasse .eyes, #lasse .shadow, .box .squash, .box.squish .squash, .target.hit .fx, .win-card, .bit, .horse .ears, .horse .h-eyes,
  .title .hero .body, .title .hero .eyes, .world.current button::after { animation: none !important; }
  .world.reveal .cloud { animation-duration: 1ms; }
}
/* ---------- Schauplätze: Deko und kleine Animationen ---------- */
.hint, .lvl-hint { color: var(--on-bg, var(--muted)); }
#deco { position: absolute; inset: 0; pointer-events: none; z-index: 4; }
.stage.has-bunting { padding-top: 26px; }
.bunting { position: absolute; left: -4px; right: -4px; top: -2px; height: 30px; }
.bunting svg { width: 100%; height: 100%; display: block; }
.pennant { transform-box: fill-box; transform-origin: 50% 0; animation: flutter 2.4s ease-in-out infinite; }
@keyframes flutter { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }
.floodlight { position: absolute; top: 20px; width: 60%; height: 70%; pointer-events: none; mix-blend-mode: screen; opacity: .35; }
.floodlight.l { left: -10%; background: radial-gradient(60% 60% at 20% 0%, #fffbe0 0%, transparent 70%); }
.floodlight.r { right: -10%; background: radial-gradient(60% 60% at 80% 0%, #fffbe0 0%, transparent 70%); }
.fly { position: absolute; left: 0; top: 0; width: 22px; height: 17px; animation: flypath var(--dur) ease-in-out var(--delay) infinite alternate; }
.fly svg { width: 100%; height: 100%; display: block; }
.fly .wings { transform-origin: 50% 50%; transform-box: view-box; animation: flap 260ms ease-in-out infinite alternate; }

.fx1-star svg { animation: f1star 850ms ease-out forwards; }
@keyframes f1star { from { transform: rotate(var(--a)) translateY(0) scale(.2); opacity: 1; } to { transform: rotate(var(--a)) translateY(-100%) scale(.36); opacity: 0; } }
.fx1-bubble { z-index: 7; } .fx1-bubble svg { animation: f1bub var(--life, 900ms) ease-out forwards; transform-origin: 30% 100%; }
.fx1-win svg { --life: 1600ms; }
@keyframes f1bub { 0% { transform: translate(25%, -95%) scale(0); opacity: 1; } 18% { transform: translate(25%, -125%) scale(1.08); } 30%, 80% { transform: translate(25%, -120%) scale(1); opacity: 1; } 100% { transform: translate(25%, -130%); opacity: 0; } }
#lasse.m-happy .body { animation: f1happy 650ms cubic-bezier(.3, 1.6, .5, 1), idle 1.6s ease-in-out 650ms infinite; }
#lasse.m-oops .body { animation: f1oops 420ms ease-in-out, idle 1.6s ease-in-out 420ms infinite; }
@keyframes f1happy { 30% { transform: translateY(-16%) scale(1.05, .96); } 60% { transform: translateY(0) scale(1.04, .97); } }
@keyframes f1oops { 20% { transform: rotate(-8deg); } 45% { transform: rotate(7deg); } 70% { transform: rotate(-4deg); } }
@media (prefers-reduced-motion: reduce) { .fx1 svg, #lasse.m-happy .body, #lasse.m-oops .body { animation: none !important; } .fx1-word svg { transform: translateY(-85%); } .fx1-bubble svg { transform: translate(25%, -120%); } }

.mapdeco { position: absolute; transform: translate(-50%, -50%); pointer-events: none; animation: mapbob 3.2s ease-in-out infinite; opacity: .95; }
.mapdeco svg { width: 100%; height: 100%; overflow: visible; display: block; }
@keyframes mapbob { 0%, 100% { transform: translate(-50%, -50%); } 50% { transform: translate(-50%, -58%); } }
@media (prefers-reduced-motion: reduce) { .mapdeco { animation: none; } }
/* Lego-Welt: Schauplatz-Name im Level-Knopf */
.lvl:has(.lvl-name) { grid-template-rows: auto 1fr auto; padding-top: 8px; }
.lvl .lvl-name { font-size: 13px; line-height: 1.1; font-weight: 700; opacity: .75; letter-spacing: .01em; }
/* Lego-Welt: Bewegung in den Wandbildern */
.lg-sweep { transform-origin: 50px 22px; animation: lg-sweep 3.6s ease-in-out infinite alternate; }
@keyframes lg-sweep { from { transform: rotate(-18deg); } to { transform: rotate(18deg); } }
.lg-peek { animation: lg-peek 5s ease-in-out infinite; }
@keyframes lg-peek { 0%, 35%, 100% { transform: translateX(-26px); } 50%, 80% { transform: translateX(0); } }
.lg-spray { opacity: 0; transform-origin: 72px 30px; animation: lg-spray 4.2s ease-out infinite; }
@keyframes lg-spray { 0%, 60% { opacity: 0; transform: translateY(6px) scale(.4); } 70% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-6px) scale(1.1); } }
.lg-nod { transform-origin: 50px 28px; animation: lg-nod 3s ease-in-out infinite; }
@keyframes lg-nod { 0%, 60%, 100% { transform: rotate(0); } 70% { transform: rotate(12deg); } 80% { transform: rotate(-4deg); } 90% { transform: rotate(8deg); } }
.lg-launch { animation: lg-launch 6s ease-in infinite; }
@keyframes lg-launch { 0%, 55% { transform: translateY(0); opacity: 1; } 85% { transform: translateY(-70px); opacity: 0; } 86% { transform: translateY(20px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
/* Gefängnisinsel: der Zug fährt ab und zu über das Gleis (unter Lasse und den Steinen) */
.lg-train { position: absolute; left: 0; top: calc(var(--my) * var(--t)); width: calc(3 * var(--t)); height: var(--t); pointer-events: none;
  animation: lg-train 16s linear infinite; animation-delay: 3s; transform: translateX(calc(-3.2 * var(--t))); }
.lg-train svg { width: 100%; height: 100%; display: block; }
@keyframes lg-train { 0% { transform: translateX(calc(-3.2 * var(--t))); } 40%, 100% { transform: translateX(calc((var(--bw) + .2) * var(--t))); } }
@media (prefers-reduced-motion: reduce) { .lg-sweep, .lg-peek, .lg-spray, .lg-nod, .lg-launch, .lg-train { animation: none !important; } .lg-train { display: none; } }
/* Editor: Variantenzeile unter den Werkzeugen */
.ed-variants { width: 100%; display: flex; gap: 6px; overflow-x: auto; padding: 6px 2px 8px; scrollbar-width: thin; background: var(--soft); border-radius: 16px; box-sizing: border-box; }
.ed-variants[hidden] { display: none; }
.vchip { flex: none; display: grid; justify-items: center; gap: 2px; padding: 5px; border-radius: 12px; font-size: 11px; }
.vchip .vtile { width: 46px; height: 46px; display: block; }
.vchip .vtile > svg, .vchip .vtile .dv > svg { width: 100%; height: 100%; display: block; overflow: visible; }
.vchip.mix .vtile { color: var(--muted); padding: 4px; box-sizing: border-box; }
.vchip.on { outline: 3px solid var(--accent); outline-offset: -3px; background: var(--white, #fff); }

// Grundplatte mit Noppen (n × n)
const plate = (fill, stud, n, x, y) => {
  const step = 100 / n, r = step * .3;
  let s = `<svg viewBox="0 0 100 100"><rect width="100" height="100" fill="${(x + y) % 2 ? `color-mix(in srgb, ${fill} 94%, #000)` : fill}"/>`;
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    const cx = step * (i + .5), cy = step * (j + .5);
    s += `<circle cx="${cx}" cy="${cy + r * .18}" r="${r}" fill="#00000022"/><circle cx="${cx}" cy="${cy}" r="${r}" fill="${stud}"/><circle cx="${cx - r * .3}" cy="${cy - r * .3}" r="${r * .35}" fill="#ffffff" opacity=".35"/>`;
  }
  return s;
};

{

  // Jedes Wandbild höchstens max-mal pro Level, gleiche nie direkt nebeneinander. Die Verteilung wird beim ersten Aufruf
  // für alle sichtbaren Wandfelder festgelegt und bleibt beim Neuzeichnen (Zoomen, Drehen) gleich.
  const limited = (fn, max = 3) => { let src = null, plan;
    return (x, y) => {
      if (src !== inside) { src = inside; plan = new Map(); const count = new Map();
        const ks = [...walls].map(k => k.split(",").map(Number)).filter(([a, b]) => touchesInside(a, b)).sort((p, q) => p[1] - q[1] || p[0] - q[0]);
        for (const [a, b] of ks) {
          const ok = (w) => (count.get(w) || 0) < max && plan.get((a - 1) + "," + b) !== w && plan.get(a + "," + (b - 1)) !== w;
          // erst ein passendes Bild suchen; reicht die Auswahl nicht, das bisher seltenste nehmen
          let w = fn(a, b), best = null;
          for (let i = 1; i < 90 && !ok(w); i++) {
            if (plan.get((a - 1) + "," + b) !== w && plan.get(a + "," + (b - 1)) !== w && (!best || (count.get(w) || 0) < (count.get(best) || 0))) best = w;
            w = fn(a + i * 17, b + i * 11); }
          if (!ok(w) && best) w = best;
          count.set(w, (count.get(w) || 0) + 1); plan.set(a + "," + b, w);
        } }
      return plan.get(x + "," + y) || fn(x, y); }; };

// Abwechslungsreichere Wände + jede Person genau einmal pro Level
// ======================================================================
// Plan wird beim Aufbau eines Levels einmal berechnet: Personen weit verteilt, übrige Wände
// gleichmäßig aus allen Motiven, nie zwei gleiche nebeneinander oder übereinander.
function feierPlan(decor, people) {
  const vis = [];
  for (const k of walls) { const [x, y] = k.split(",").map(Number); if (touchesInside(x, y)) vis.push([x, y]); }
  const plan = new Map(), chosen = [];
  const order = vis.slice().sort((a, b) => hash(a[0], a[1], 7) - hash(b[0], b[1], 7));
  for (const [pi, p] of people.entries()) {
    let best = null, bestD = -1;
    for (const [x, y] of order) {
      if (plan.has(key(x, y))) continue;
      const d = chosen.length ? Math.min(...chosen.map(([a, b]) => Math.abs(a - x) + Math.abs(b - y))) : 0;
      if (d > bestD) { bestD = d; best = [x, y]; }
      if (!chosen.length) break;
    }
    if (!best) break;
    plan.set(key(best[0], best[1]), p.replace("<svg", `<svg data-person="${pi}"`)); chosen.push(best);
  }
  const used = decor.map(() => 0);
  vis.sort((a, b) => a[1] - b[1] || a[0] - b[0]);
  for (const [x, y] of vis) {
    const k = key(x, y); if (plan.has(k)) continue;
    const near = [plan.get(key(x - 1, y)), plan.get(key(x, y - 1)), plan.get(key(x + 1, y)), plan.get(key(x, y + 1))];
    const idx = decor.map((_, i) => i).sort((a, b) => used[a] - used[b] || hash(x, y, a + 50) - hash(x, y, b + 50));
    let html = null;
    for (const i of idx) { const h = decor[i](x, y); if (!near.includes(h)) { html = h; used[i]++; break; } }
    plan.set(k, html || decor[idx[0]](x, y));
  }
  return plan;
}
const feierWalls = (decor, people) => { let ref = null, plan = null;
  return (x, y) => { if (ref !== walls) { ref = walls; plan = feierPlan(decor, people()); } return plan.get(key(x, y)) || decor[pick(x, y, 31, decor.length)](x, y); }; };

function parse(rows) {
  W = Math.max(...rows.map(r => r.length)); H = rows.length;
  walls = new Set(); goals = new Set(); inside = new Set(); startBoxes = []; start = null;
  rows.map(r => r.padEnd(W)).forEach((r, y) => [...r].forEach((c, x) => {
    if (c === "#") walls.add(key(x, y));
    if (".*+".includes(c)) goals.add(key(x, y));
    if ("$*".includes(c)) startBoxes.push([x, y]);

  const st = [start];
  while (st.length) {
    const [x, y] = st.pop(), k = key(x, y);

    inside.add(k); st.push([x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]);

  for (let x = 0; x < W; x++) os.push([x, 0], [x, H - 1]);

  while (os.length) {
    const [x, y] = os.pop(), k = key(x, y);
    if (x < 0 || y < 0 || x >= W || y >= H || walls.has(k) || outer.has(k) || inside.has(k)) continue;
    outer.add(k); os.push([x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]);

  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { const k = key(x, y); if (!walls.has(k) && !outer.has(k)) inside.add(k); }
}

function loadLevel(w, l, data) {

function buildBoard() {
  let html = "";
  const xs = [...inside].map(k => +k.split(",")[0]), ys = [...inside].map(k => +k.split(",")[1]);
  const ctx = { mid: Math.round((Math.min(...xs) + Math.max(...xs)) / 2), midY: Math.round((Math.min(...ys) + Math.max(...ys)) / 2) };
  const mood = T.mood || moodOf(L.theme, S ? S.name : "");
  const free = (x, y) => !inside.has(key(x, y)) && !(walls.has(key(x, y)) && touchesInside(x, y));
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const pos = `style="--x:${x};--y:${y}"`;
    if (inside.has(key(x, y))) {
      html += S ? `<div class="tile" ${pos}>${S.floor(x, y, ctx)}</div>` : `<div class="tile floor${(x + y) % 2 ? " b" : ""}" ${pos}></div>`;
      const fd = floorDetail(mood, x, y);
      if (fd) html += `<div class="tile detail" ${pos}><svg viewBox="0 0 100 100">${fd}</svg></div>`;
    }
    else if (S && free(x, y)) { const d = S.deco(x, y); if (d) html += `<div class="tile deco" ${pos}>${d}</div>`; }
  }

  if (S && S.special === "trainer") {
    let best = null;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      if (!free(x, y)) continue;
      const nearWall = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => walls.has(key(x + dx, y + dy)));
      const score = (nearWall ? 100 : 0) + x + y;
      if (!best || score > best[2]) best = [x, y, score];
    }
    if (best) html = html.replace(new RegExp(`<div class="tile deco" style="--x:${best[0]};--y:${best[1]}">.*?</svg></div>`), "")
      + `<div class="tile deco" style="--x:${best[0]};--y:${best[1]}">${TRAINER}</div>`;
  }

        w = fn(x + dx, y + dy);
      }
      wallHtml[k] = w;
      html += `<div class="tile wall" ${pos}>${w}</div>`;
      const wd = wallDetail(mood, x, y);
      if (wd) html += `<div class="tile detail" ${pos}><svg viewBox="0 0 100 100">${wd}</svg></div>`;
    }
    if (goals.has(k)) html += `<div class="tile target" data-k="${k}" ${pos}>${T.targetAt ? T.targetAt(...k.split(",").map(Number)) : T.target(curLevel)}</div>`;
  }
  if (T.levelName) html += signHTML(T.levelName(curLevel));
  if (S && S.boardExtras) html += S.boardExtras(ctx, W, H);
  board.innerHTML = html;
  const side = (S && S.side) || null, arena = document.querySelector(".arena");
  if (arena) {
    arena.classList.toggle("has-side", !!side);
    const fig = (list) => (list || []).map((s, i) => s.replace("<svg ", `<svg class="bobside" style="animation-delay:${-i * .7}s" `)).join("");
    document.getElementById("side-l").innerHTML = side ? fig(side.l) : "";
    document.getElementById("side-r").innerHTML = side ? fig(side.r) : "";

  }

  document.querySelector(".stage").classList.toggle("has-bunting", extras.includes("bunting"));
  goalEls = {};
  board.querySelectorAll(".target").forEach(el => goalEls[el.dataset.k] = el);
  const slots = document.getElementById("slots");
  slots.classList.toggle("many", goals.size > 5);

}
// Schild mit dem Namen des Fundorts: auf der längsten sichtbaren Wandreihe, bevorzugt oben
function signHTML(text) {
  let best = null;

    while (x < W) {
      if (walls.has(key(x, y)) && touchesInside(x, y)) {
        let e = x; while (e + 1 < W && walls.has(key(e + 1, y)) && touchesInside(e + 1, y)) e++;

function reset(data) {

  boxes = data?.boxes ? data.boxes.map(b => ({ ...b })) : startBoxes.map(([x, y], id) => ({ id, x, y, rot: 0 }));
  history = []; moves = data?.moves ?? 0; pushes = data?.pushes ?? 0; facing = 1;
  document.getElementById("win").hidden = true;

}

function makeSprites() {
  board.querySelectorAll(".sprite").forEach(el => el.remove());
  boxEls = boxes.map((b, i) => {
    const el = document.createElement("div");
    el.className = "sprite box";
    if (T.boxStyle) el.style.cssText = T.boxStyle(i);
    if (T.boxColors) { const [c, m] = T.boxColors[i % T.boxColors.length]; if (c) el.style.setProperty("--c1", c); if (m) el.style.setProperty("--c2", m); }

    board.appendChild(el); return el;
  });
  lasseEl = document.createElement("div");

  lasseEl.innerHTML = `<div class="face-dir">${LASSE[(S && S.lasse) || L.theme]}</div>`;
  board.appendChild(lasseEl);
  // Kisten, die schon im Ziel starten, nicht beim Aufbau hüpfen lassen
  boxes.forEach((b, i) => { if (goals.has(key(b.x, b.y))) boxEls[i].classList.add("in"); });
}

const boxId = () => T.levelBox ? T.levelBox(curLevel) : T.box;
const boxAt = (x, y) => boxes.find(b => b.x === x && b.y === y);
function render() {
  lasseEl.style.setProperty("--x", player[0]); lasseEl.style.setProperty("--y", player[1]);
  lasseEl.querySelector(".face-dir").style.transform = `scaleX(${facing})`;
  let scored = 0;
  const hit = new Set();
  boxes.forEach((b, i) => {
    const el = boxEls[i], k = key(b.x, b.y);
    el.style.setProperty("--x", b.x); el.style.setProperty("--y", b.y); el.style.setProperty("--rot", b.rot + "deg");
    const isIn = goals.has(k);
    if (isIn) { scored++; hit.add(k); }
    if (isIn && !el.classList.contains("in") && el.dataset.ready) { if (S && S.sound && SND[S.sound]) SND[S.sound](); else SND.place(); if (typeof FX !== "undefined") FX.place(b.x, b.y); }
    el.dataset.ready = "1";

  });

      if (!best || moves < best.m) p.solved[k] = { m: moves, p: pushes }; }
    save();
    document.getElementById("win-text").textContent = T.prize && curLevel === NL(curWorld) - 1 ? T.prize.text(moves) : T.winText(moves, pushes, curLevel);
    const o = L.custom ? L.custom.opt : optOf(curWorld, curLevel), gold = o && moves <= o;
    let ws = document.getElementById("win-star");
    if (!ws) { document.getElementById("win-text").insertAdjacentHTML("afterend", '<p id="win-star" class="win-star"></p>'); ws = document.getElementById("win-star"); }
    ws.innerHTML = `<svg viewBox="0 0 100 100"><use href="#${gold ? "stern" : "stern-silber"}"/></svg><span>${gold ? "Goldener Stern! Weniger Schritte geht nicht." : o ? `Silberner Stern. Schaffst du es in ${o} Schritten? Dann gibt es Gold.` : "Silberner Stern!"}</span>`;
    const nextBtn = document.getElementById("next");
    if (L.custom) nextBtn.textContent = L.back === "editor" ? "Zurück in die Werkstatt" : "Zurück zum Koffer";
    else if (curLevel < NL(curWorld) - 1) nextBtn.textContent = `Weiter: Level ${curLevel + 2}`;
    else nextBtn.textContent = curWorld < WORLDS.length - 1 ? "Zur Weltkarte" : "Fertig!";

    setTimeout(() => { if (w === curWorld && l === curLevel && lasseEl.classList.contains("cheer")) { winEl.hidden = false; confetti(); } }, 450);
  } else if (!won) { winEl.hidden = true; lasseEl.classList.remove("cheer"); document.querySelectorAll(".side svg.jubel").forEach(s => s.classList.remove("jubel")); }
}

function follow() {
  const stage = document.querySelector(".stage");
  if (ZOOM > 1) {
    const t = TILE0 * ZOOM, px = player[0] * t + t / 2, py = player[1] * t + t / 2, vw = stage.clientWidth, vh = stage.clientHeight, m = t * 1.5;
    let l = stage.scrollLeft, tp = stage.scrollTop;
    if (px - l < m || px - l > vw - m) l = px - vw / 2;
    if (py - tp < m || py - tp > vh - m) tp = py - vh / 2;
    if (l !== stage.scrollLeft || tp !== stage.scrollTop) stage.scrollTo({ left: l, top: tp, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
    return;
  }
  const wide = board.scrollWidth > stage.parentElement.clientWidth - 8;
  stage.classList.toggle("wide", wide);
  if (!wide) return;
  const t = board.clientWidth / W;
  const won = !document.getElementById("win").hidden || lasseEl.classList.contains("cheer");
  const left = won ? 0 : player[0] * t - stage.clientWidth / 2 + t / 2;
  stage.scrollTo({ left: Math.max(0, left), behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
}
function pulse(el, cls, others) {

const DIRS = { u: [0, -1], d: [0, 1], l: [-1, 0], r: [1, 0] };
function step(d) {
  if (screen !== "game" || lasseEl.classList.contains("cheer")) return;
  const [dx, dy] = DIRS[d];
  const nx = player[0] + dx, ny = player[1] + dy;
  if (dx) facing = dx;
  if (walls.has(key(nx, ny))) { if (typeof FX !== "undefined" && FX.bump) FX.bump(); render(); return; }
  const snap = { player: [...player], boxes: boxes.map(b => ({ ...b })), moves, pushes };
  const b = boxAt(nx, ny);
  if (b) {
    const bx = nx + dx, by = ny + dy;
    if (walls.has(key(bx, by)) || boxAt(bx, by)) { if (typeof FX !== "undefined" && FX.bump) FX.bump(); render(); return; }
    b.x = bx; b.y = by;
    if (T.rollsBox ? T.rollsBox(b) : typeof T.rolls === "function" ? T.rolls(curLevel) : T.rolls) b.rot += (dx || dy) * 180; // Ball: eine Feldlänge ≈ halbe Umdrehung
    else pulse(boxEls[boxes.indexOf(b)], T.squish ? "squish" : "shove");
    pushes++; SND.push();
  }
  history.push(snap);
  player = [nx, ny]; moves++;
  pulse(lasseEl, b ? "kick" : "hop", ["hop", "kick"]);
  // Optische Effekte (nur wenn ein Spiel sie mitbringt, z. B. Staubwölkchen in Teil 2)
  if (typeof FX !== "undefined") FX.step(snap.player, dx, dy, b ? { x: b.x, y: b.y, el: boxEls[boxes.indexOf(b)] } : null);

}

const ptrs = new Map();

// ---------- Lösbarkeit prüfen (Breitensuche in kleinen Häppchen, damit das iPad nicht hängt) ----------
function checkLevel(rows, done) {
  const H = rows.length, W = Math.max(...rows.map(r => r.length)), N = W * H;
  const wall = new Uint8Array(N), goal = new Uint8Array(N); let player = -1; const boxes0 = [];
  rows.forEach((r, y) => [...r.padEnd(W)].forEach((c, x) => { const i = y * W + x;
    if (c === "#") wall[i] = 1; if (".*+".includes(c)) goal[i] = 1; if ("$*".includes(c)) boxes0.push(i); if ("@+".includes(c)) player = i; }));
  const D = [-W, W, -1, 1];
  // lebendige Felder: von dort kann eine Kiste noch ein Ziel erreichen (rückwärts ziehen)
  const live = new Uint8Array(N), q0 = [];
  for (let i = 0; i < N; i++) if (goal[i]) { live[i] = 1; q0.push(i); }
  while (q0.length) { const b = q0.pop(); for (const d of D) { const nb = b + d, pl = b + 2 * d;
    if (nb < 0 || pl < 0 || nb >= N || pl >= N || wall[nb] || wall[pl] || live[nb]) continue; live[nb] = 1; q0.push(nb); } }
  const goalKey = [...Array(N).keys()].filter(i => goal[i]).join(",");
  const keyOf = (p, bs) => p + "|" + bs.join(",");
  const start = { p: player, b: boxes0.slice().sort((a, b) => a - b), n: 0 };
  // Stufe 1: kürzester Weg in Schritten (für den goldenen Stern), Stufe 2: nur schaffbar ja/nein (Spielerplatz zusammengefasst)
  const runMoves = (cap, next) => {
    const seen = new Set([keyOf(start.p, start.b)]); let frontier = [start], depth = 0;
    const tick = () => {
      const t0 = performance.now();
      while (performance.now() - t0 < 30) {
        if (!frontier.length) return next({ status: "impossible" });
        const nf = [];
        for (const s of frontier) {
          if (s.b.join(",") === goalKey) return next({ status: "ok", moves: depth });
          for (const d of D) {
            const np = s.p + d; if (wall[np]) continue;
            let nb = s.b; const bi = s.b.indexOf(np);
            if (bi >= 0) { const t = np + d; if (wall[t] || !live[t] || s.b.includes(t)) continue; nb = s.b.slice(); nb[bi] = t; nb.sort((a, b) => a - b); }
            const k = keyOf(np, nb); if (seen.has(k)) continue; seen.add(k); nf.push({ p: np, b: nb });
          }
        }
        frontier = nf; depth++;
        if (seen.size > cap) return next({ status: "unknown" });
      }
      setTimeout(tick, 0);
    };
    tick();
  };
  const reach = (p, bs) => { const set = new Set(bs), vis = new Uint8Array(N), st = [p]; vis[p] = 1; let mn = p;
    while (st.length) { const c = st.pop(); if (c < mn) mn = c; for (const d of D) { const n = c + d; if (!wall[n] && !vis[n] && !set.has(n)) { vis[n] = 1; st.push(n); } } } return { vis, mn }; };
  const runPushes = (cap, next) => {
    const r0 = reach(start.p, start.b), seen = new Set([keyOf(r0.mn, start.b)]); const queue = [start]; let qi = 0;
    const tick = () => {
      const t0 = performance.now();
      while (performance.now() - t0 < 30) {
        if (qi >= queue.length) return next({ status: "impossible" });
        const s = queue[qi++]; if (s.b.join(",") === goalKey) return next({ status: "ok" });
        const { vis } = reach(s.p, s.b);
        for (let bi = 0; bi < s.b.length; bi++) for (const d of D) {
          const b = s.b[bi], from = b - d, to = b + d;
          if (!vis[from] || wall[to] || !live[to] || s.b.includes(to)) continue;
          const nb = s.b.slice(); nb[bi] = to; nb.sort((x, y) => x - y);
          const k = keyOf(reach(b, nb).mn, nb); if (seen.has(k)) continue; seen.add(k); queue.push({ p: b, b: nb });
        }
        if (seen.size > cap) return next({ status: "unknown" });
      }
      setTimeout(tick, 0);
    };
    tick();
  };
  if (boxes0.some(b => !live[b])) return setTimeout(() => done({ status: "impossible" }), 400);
  runMoves(300000, (r) => r.status === "unknown" ? runPushes(400000, done) : done(r));
}

  const vrow = document.getElementById("ed-variants"), vlist = VKINDS[edTool] ? withEditorGlobals(lv, () => variantsOf(cur, edTool)) : [];
  vrow.hidden = !(edVarOpen && vlist.length > 1);
  if (!vrow.hidden) {
    const sel = curVar(edTool), wrapV = (h) => edTool === "box" ? h : dWrap(h, cur);
    vrow.innerHTML = `<button type="button" class="vchip mix${sel ? "" : " on"}" data-v="-1" aria-label="Gemischt"><span class="vtile">${DICE}</span><span class="vname">Gemischt</span></button>` +
      vlist.map((o, n) => `<button type="button" class="vchip${sameV(sel, o.v) ? " on" : ""}" data-v="${n}" aria-label="Variante ${n + 1}"><span class="vtile">${wrapV(o.html)}</span></button>`).join("");
    vrow.querySelectorAll("[data-v]").forEach(b => b.addEventListener("click", () => {
      const n = +b.dataset.v, all = vSel(), mine = all[edDesign] = all[edDesign] || {};
      if (n < 0) delete mine[edTool]; else mine[edTool] = vlist[n].v;

}
function drawEdBoard() {
  const lv = edLevel, b = document.getElementById("edboard"), t = edTileSize();
  b.style.setProperty("--w", lv.w); b.style.setProperty("--h", lv.h); b.style.setProperty("--t", t + "px");
  const ctx = (() => { const xs = [], ys = []; lv.cells.forEach((c, i) => { if (c && c[0] === "f") { xs.push(i % lv.w); ys.push(Math.floor(i / lv.w)); } });
    return { mid: Math.round((Math.min(...xs) + Math.max(...xs)) / 2), midY: Math.round((Math.min(...ys) + Math.max(...ys)) / 2) }; })();
  const r = compileLevel(lv); let bi = 0; const boxAtIdx = {};
  // Kisten-Symbole in derselben Reihenfolge wie im Spiel
  for (let y = 0; y < lv.h; y++) for (let x = 0; x < lv.w; x++) { const i = y * lv.w + x; if (lv.box[i]) boxAtIdx[i] = bi++; }
  b.innerHTML = withEditorGlobals(lv, () => lv.cells.map((c, i) => {
    const x = i % lv.w, y = Math.floor(i / lv.w), pos = `style="--x:${x};--y:${y}"`;
    let h = "";
    if (!c) h += `<div class="tile ed-empty" ${pos}></div>`;
    else { const d = designByKey(c[1]) || DESIGNS[0]; h += `<div class="tile" ${pos}>${dWrap(c[0] === "w" ? vWall(d, x, y, c[2]) : vFloor(d, x, y, ctx, c[2]), d)}</div>`; }
    if (lv.goal[i]) { const d = designByKey(lv.goal[i]) || DESIGNS[0]; h += `<div class="tile" ${pos}>${dWrap(dTarget(d), d)}</div>`; }
    if (lv.box[i]) { const k = boxAtIdx[i]; h += `<div class="tile ed-box" ${pos}>${boxSvg(r.boxSyms[k], r.boxCols[k])}</div>`; }
    if (lv.start.i === i) h += `<div class="tile ed-lasse" ${pos}>${LASSE[dLasse(designByKey(lv.start.d) || DESIGNS[0])]}</div>`;
    return h;
  }).join(""));
  const prob = problemOf(lv), { boxes, goals } = countOf(lv);
  document.getElementById("ed-status").innerHTML = `${boxes} ${boxes === 1 ? "Kiste" : "Kisten"} · ${goals} ${goals === 1 ? "Zielplatz" : "Zielplätze"} · ${prob ? esc(prob) : "Bereit zum Testen!"}`;
  document.getElementById("ed-status").classList.toggle("ok", !prob);
}
function edApply(i, first) {
  const lv = edLevel, d = edDesign, c = lv.cells[i];
  const isStart = lv.start.i === i;
  if (edTool === "wall") { if (isStart) return false; const v = curVar("wall");
    if (c && c[0] === "w" && c[1] === d && sameV(c[2], v)) return false; lv.cells[i] = v ? ["w", d, v] : ["w", d]; delete lv.box[i]; delete lv.goal[i]; }
  else if (edTool === "floor") { const v = curVar("floor"); if (c && c[0] === "f" && c[1] === d && sameV(c[2], v)) return false; lv.cells[i] = v ? ["f", d, v] : ["f", d]; }
  else if (edTool === "erase") {
    if (isStart) return false;
    if (lv.box[i]) delete lv.box[i]; else if (lv.goal[i]) delete lv.goal[i]; else if (c) lv.cells[i] = 0; else return false;
  } else {
    if (!first) return false;
    if (!c || c[0] !== "f") lv.cells[i] = ["f", d];
    if (edTool === "box") { if (isStart) return false; const v = curVar("box"), val = v ? [d, ...v] : d; if (sameV(lv.box[i], val)) delete lv.box[i]; else lv.box[i] = val; }
    if (edTool === "goal") { if (lv.goal[i] === d) delete lv.goal[i]; else lv.goal[i] = d; }
    if (edTool === "start") { delete lv.box[i]; lv.start = { i, d }; }
  }

}
(() => {
  const b = document.getElementById("edboard"); let down = false, last = -1, raf = 0;
  const cellAt = (e) => { const r = b.getBoundingClientRect(), t = r.width / edLevel.w; const x = Math.floor((e.clientX - r.left) / t), y = Math.floor((e.clientY - r.top) / t);
    return x >= 0 && y >= 0 && x < edLevel.w && y < edLevel.h ? y * edLevel.w + x : -1; };
  const redraw = () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; drawEdBoard(); }); };
  b.addEventListener("pointerdown", (e) => { const i = cellAt(e); if (i < 0) return; down = true; last = i; b.setPointerCapture(e.pointerId);
    if (edApply(i, true)) { redraw(); SND.place(); } });
  b.addEventListener("pointermove", (e) => { if (!down) return; const i = cellAt(e); if (i < 0 || i === last) return; last = i; if (edApply(i, false)) redraw(); });
  const up = () => { if (down) { down = false; save(); } };
  b.addEventListener("pointerup", up); b.addEventListener("pointercancel", up);
})();
document.getElementById("ed-name").addEventListener("input", (e) => { if (edLevel) { edLevel.name = e.target.value.slice(0, 24) || "Mein Level"; save(); } });
document.getElementById("ed-test").addEventListener("click", () => { save(); testLevel(edLevel, "editor"); });
document.getElementById("ed-publish").addEventListener("click", () => { save(); publishLevel(edLevel); });
window.addEventListener("resize", () => { if (screen === "editor" && edLevel) drawEdBoard(); });
</script>
